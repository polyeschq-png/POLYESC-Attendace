<style>

:root{

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--tx);font-size:13.5px;display:flex;min-height:100vh;opacity:0;transition:opacity .25s}

.nav a{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:6px;color:rgba(255,255,255,.78);cursor:pointer;font-size:13px;margin-bottom:2px;user-select:none}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.on{background:#fff;color:var(--pri);font-weight:700}
.nav .bd{margin-left:auto;font-size:11px;font-family:var(--mono);background:rgba(255,255,255,.18);border-radius:9px;padding:0 6px;min-width:18px;text-align:center}
.nav a.on .bd{background:var(--pri-lt)}
.nav .bd.hot{background:var(--red);color:#fff}

.me{padding:12px;border-top:1px solid rgba(255,255,255,.12);font-size:11px}
.me .n{font-weight:700;font-size:12px}.me .e{opacity:.55;word-break:break-all;margin-bottom:8px}
.me button{width:100%;padding:6px;border-radius:5px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font-size:11px;cursor:pointer;margin-top:4px}
.main{margin-left:184px;flex:1;min-width:0;display:flex;flex-direction:column}
header{height:54px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 20px;position:sticky;top:0;z-index:40}

.content{padding:18px 22px 60px}
.panel{display:none}.panel.on{display:block}
/* 공통 */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.ct{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid transparent;white-space:nowrap}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}

.step:hover{border-color:var(--pri)}
.step .k{font-size:11px;color:var(--tx3);font-weight:700}
.step .v{font-size:22px;font-weight:700;font-family:var(--mono);margin:3px 0 1px}
.step .d{font-size:11.5px;color:var(--tx2)}
.step.ok{border-left:4px solid var(--grn)}.step.todo{border-left:4px solid var(--red)}.step.wait{border-left:4px solid var(--line2)}

.split{display:flex;background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-height:420px}
.sl{width:158px;min-width:158px;border-right:1px solid var(--line);overflow-y:auto;max-height:calc(100vh - 230px)}
.sr{flex:1;min-width:0;overflow:auto;max-height:calc(100vh - 230px)}
.ci{padding:9px 13px;border-bottom:1px solid #f0f2f5;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12.5px}

.ci .n{font-size:11px;font-family:var(--mono);color:var(--tx3)}
.ci.on .n{color:#fff}
.ci .n.hot{color:var(--red);font-weight:700}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs a{padding:8px 14px;cursor:pointer;color:var(--tx2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-2px;font-size:13px}

.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}

.sec{padding:12px 14px 6px;font-weight:700;font-size:12.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

select.pick.sug{border-color:var(--grn);background:var(--grn-lt)}
details summary{cursor:pointer;color:var(--tx2);font-size:12px;padding:10px 14px}

.mbg{position:fixed;inset:0;background:rgba(15,22,35,.55);z-index:1000;display:none;align-items:center;justify-content:center;padding:18px}
.mbg.on{display:flex}
.modal{background:var(--white);border-radius:10px;max-width:920px;width:100%;max-height:92vh;overflow:auto;padding:20px}

.kv{display:grid;grid-template-columns:90px 1fr;gap:5px 10px;font-size:13px;margin:10px 0}

.toast{position:fixed;bottom:20px;right:20px;background:#1d2735;color:#fff;border-radius:8px;padding:10px 15px;font-size:12.5px;z-index:2000;opacity:0;transform:translateY(20px);transition:all .25s;max-width:380px}
.toast.on{opacity:1;transform:none}.toast.err{background:var(--red)}
.st-open{color:var(--red);font-weight:700}.st-replied{color:var(--blu);font-weight:700}.st-approved{color:var(--grn);font-weight:700}.st-rejected{color:var(--org);font-weight:700}
.dows{display:inline-flex;gap:3px}
.dows label{font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:2px 6px;cursor:pointer;background:var(--gry-lt)}

.dows input{display:none}
.bar{height:6px;background:var(--gry-lt);border-radius:99px;overflow:hidden;margin-top:6px}

table.tfix{table-layout:fixed;min-width:1040px}

table.tfix input[type=date],table.tfix select{width:100%;max-width:100%;padding:4px 6px;font-size:12px}

.evh{cursor:zoom-in}
.hov{position:fixed;z-index:1500;display:none;background:var(--white);border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 32px rgba(15,22,35,.28);padding:10px;pointer-events:none;width:min(760px,62vw)}

</style>
</head>

<script>

function toast(m,err){const t=$('toast');t.textContent=m;t.className='toast on'+(err?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',3200);}
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
function parseYMD(s){const m=String(s||'').match(/(\d{4})\D{0,2}(\d{1,2})\D{0,2}(\d{1,2})/);return m?`${m[1]}-${pad2(+m[2])}-${pad2(+m[3])}`:'';}
function dowOf(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).getDay();}
function fmtMD(s){if(!s)return '';const [y,m,d]=s.split('-');return `${+m}/${+d}(${DOW[dowOf(s)]})`;}
function isHoliday(s){return HOLIDAYS.has(s)||(CONFIG.holidays||[]).includes(s);}

function weekNo(mon){const [y,m,d]=mon.split('-').map(Number);const th=new Date(y,m-1,d+3);return `${th.getFullYear()}년 ${th.getMonth()+1}월 ${Math.ceil(th.getDate()/7)}주차`;}

function sortCampuses(a){return [...a.filter(c=>!MPOLY.includes(c)).sort((x,y)=>x.localeCompare(y,'ko')),...MPOLY.filter(c=>a.includes(c))];}
function normCampus(n){if(!n)return null;n=String(n).trim();if(CAMPUS_ALIASES[n])return CAMPUS_ALIASES[n];for(const k of Object.keys(CAMPUS_ALIASES).sort((a,b)=>b.length-a.length)){if(n.toLowerCase().includes(k.toLowerCase()))return CAMPUS_ALIASES[k];}return null;}
function campusGroup(c){return MERGE_GROUPS.find(g=>g.includes(c))||[c];}
function groupKey(c){const g=MERGE_GROUPS.find(g=>g.includes(c));return g?g[0]:c;}
// 대소문자·공백·전각/반각 차이만 무시 (괄호·부분일치는 같은 사람으로 보지 않음)
function strictKey(n){return String(n||'').normalize('NFKC').replace(/[\s\u200b-\u200d\ufeff]+/g,' ').trim().toLowerCase();}
function baseName(n){return String(n||'').trim().replace(/\s*[\(（][^)）]*[\)）]/g,'').replace(/\s+/g,' ').trim();}
function normName(n){return strictKey(baseName(n));}
// 급여대장 이름의 육휴·출휴 표시 제거: "홍길동(육휴_2026.03~", "홍길동_출휴" → 홍길동
const LEAVE_MARK=/(육휴|출휴|육아휴직|출산휴가|출산전후|휴직)/;
function stripMark(n){return String(n||'').replace(/[\s_\-(（\[].*?(육휴|출휴|육아휴직|출산휴가|출산전후|휴직).*$/,'').trim();}
function personKey(n){return normName(stripMark(n));}
// "09:02", "9:02:15", "+01:30"(익일) → 분. 실패 null
function parseTime(v){
  if(v==null||v==='')return null;
  const s=String(v).trim();const next=s.startsWith('+');
  let m=s.match(/(\d{1,2}):(\d{2})/);
  if(m)return (+m[1])*60+(+m[2])+(next?1440:0);
  m=s.match(/^(\d{2})(\d{2})$/);if(m)return (+m[1])*60+(+m[2]);
  const n=parseFloat(s);if(!isNaN(n)&&n>0&&n<1)return Math.round(n*1440);
  return null;
}

function randomToken(){const a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(36).padStart(2,'0')).join('').slice(0,22);}

window.setWeek=async function(s){
  if(!s)return;
  const [y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d);
  const mon=new Date(dt);mon.setDate(dt.getDate()-((dt.getDay()+6)%7));
  const dates=[];for(let i=0;i<5;i++){const x=new Date(mon);x.setDate(mon.getDate()+i);dates.push(ymd(x));}
  WEEK={key:dates[0],start:dates[0],end:dates[4],dates,months:[...new Set(dates.map(x=>x.slice(0,7)))]};
  $('wk-pick').value=dates[0];$('wk-no').textContent=weekNo(dates[0]);$('wk-label').textContent=`${fmtMD(dates[0])} ~ ${fmtMD(dates[4])}`;
  CAPS={files:[]};LEAVES=[];ITEMS=[];ITEMS_WEEK='';ANA=null;D=derive();renderBadges();renderTab();
  await loadWeekInputs();
  if(TAB==='review')loadReview();
};

function derive(full){

  // 1) CAPS 항목 합치기 (이름+사번 기준)
  const em=new Map();
  CAPS.files.forEach(f=>f.persons.forEach(p=>{const k=p.n+'|'+(p.e||'');let e=em.get(k);if(!e){e={key:k,name:p.n,empId:p.e||'',rec:{}};em.set(k,e);}Object.entries(p.r).forEach(([d,v])=>{const o=e.rec[d]||['',''];e.rec[d]=[v[0]||o[0],v[1]||o[1]];});}));

      return;
    }
    const out=p.ignored?'':outOf(p),gone=out.startsWith('퇴사')||out.startsWith('입사');
    if(out)[p.payName,p.formalName,p.attendName].filter(Boolean).forEach(n=>{const k=normName(n);if(!outIdx.has(k))outIdx.set(k,{campus:c,why:out,kind:out.startsWith('퇴사')?'gone':out.startsWith('입사')?'join':'leave',hire:parseYMD(p.hireDate),formal:p.formalName||'',p,name:p.payName||n});});
    if(p.attendName&&!gone)add(p.ignored?ignIdx:linkIdx,strictKey(p.attendName),{campus:c,p});
    if(!p.ignored&&!gone){[p.attendEmp,p.empNo].filter(Boolean).forEach(x=>add(empIdx,strictKey(x),{campus:c,p}));}
    if(!p.attendName&&!p.ignored&&p.payName&&!out)[...new Set([personKey(p.payName),p.formalName?normName(p.formalName):''])].filter(Boolean).forEach(k=>{if(!payIdx.has(k))payIdx.set(k,new Set());payIdx.get(k).add(c);});
  }));
  const hqSet=new Set(HQSTAFF.map(strictKey));
  // 2) CAPS 이름 분류
  //  campus: 급여대장 인원과 연결 / join: 입사 예정자 / ask: 이름 확인 불가 → 소명 요청 / gone: 퇴사자 CAPS 미삭제 → 소명 요청
  //  hq: 본사 / ignore: 점검 제외 / unsorted: 처리 필요
  entries.forEach(e=>{
    const s=strictKey(e.name),a=ASSIGN[e.key]||'',dup=nameCnt[s]>1;
    e.dup=dup;e.active=WEEK.dates.some(d=>e.rec[d]&&(e.rec[d][0]||e.rec[d][1]));
    const links=linkIdx.get(s)||[],lg=[...new Set(links.map(x=>groupKey(x.campus)))];
    const pc=payIdx.get(normName(e.name));const pg=pc?[...new Set([...pc].map(groupKey))]:[];
    e.guess=pg.length===1?[...pc][0]:lg.length===1?links[0].campus:'';
    const byEmp=dup&&e.empId?(empIdx.get(strictKey(e.empId))||[]):[];
    const plain=a&&!a.startsWith('__');
    if(a==='__hq'){e.cls='hq';e.src='직접 지정';}
    else if(a==='__ignore'){e.cls='ignore';e.why='점검 대상 제외';}
    else if(a==='__ar'){e.cls='ignore';e.why='AR센터';}
    else if(byEmp.length===1){e.cls='campus';e.campus=byEmp[0].campus;e.group=groupKey(e.campus);e.forceP=byEmp[0].p;}
    else if(dup&&plain){e.cls='campus';e.campus=a;e.group=groupKey(a);}
    else if(!dup&&lg.length===1){e.cls='campus';e.group=lg[0];e.campus=links[0].campus;}
    else if(a.startsWith('__ask:')){e.cls='ask';e.campus=a.slice(6);e.group=groupKey(e.campus);}
    else if(plain){e.cls='join';e.campus=a;e.group=groupKey(a);e.hire=parseYMD(ASSIGN_HIRE[e.key]);}
    else if(lg.length>1){e.cls='unsorted';e.why=`같은 CAPS 이름이 여러 캠퍼스 인원에 연결돼 있음 (${links.map(x=>x.campus+' '+(x.p.payName||'')).join(', ')})`;}
    else if(dup){e.cls='unsorted';e.why=`같은 이름이 CAPS에 ${nameCnt[s]}개 — 사번으로도 구분이 안 됨`;}
    else if(ignIdx.has(s)){e.cls='ignore';e.why='전체근로자에서 무시 처리된 이름';}
    else if(hqSet.has(s)&&a!=='__nothq'){e.cls='hq';e.src='본사 직원명단 자동';}
    else if(!pc&&outIdx.has(normName(e.name))){const o=outIdx.get(normName(e.name));e.campus=o.campus;e.group=groupKey(o.campus);e.out=o;
      if(o.kind==='gone'){e.cls=a==='__gone'?'gone':'gonePend';e.why=`급여대장 ${o.why} · ${o.campus} ${o.name}`;}
      else if(o.kind==='join'){e.cls='join';e.hire=o.hire;e.fromPay=o.name;}
      else if(o.kind==='notpay'){e.cls='unsorted';e.out=o;e.guess=o.campus;e.why=`이번 기간 급여대장에 없음 (캠퍼스 명단: ${o.campus} ${o.name})`;}
      else{e.cls='ignore';e.why=`휴직 중 · ${o.campus} ${o.name}`;}}
    else{e.cls='unsorted';e.why='급여대장(전체근로자)에서 이름을 찾을 수 없음';}
  });
  // 3) 캠퍼스로 분류된 CAPS 이름 ↔ 급여대장 인원
  const byPerson=new Map();
  entries.filter(e=>e.cls==='campus').forEach(e=>{
    if(e.forceP&&!byPerson.has(e.forceP)){e.person=e.forceP;e.pcampus=e.campus;byPerson.set(e.forceP,e);return;}
    const sc=x=>(x.p.payName?4:0)+(personKey(x.p.payName)===normName(e.name)||(x.p.formalName&&normName(x.p.formalName)===normName(e.name))?2:0)+(!x.p.isLeave&&!SKIP_POSITIONS.includes(x.p.posOverride||'')&&!isSafety(x.p.posOverride)?1:0);
    const c=(linkIdx.get(strictKey(e.name))||[]).filter(x=>groupKey(x.campus)===e.group&&!byPerson.has(x.p)).sort((a,b)=>sc(b)-sc(a))[0];
    if(c){e.person=c.p;e.pcampus=c.campus;byPerson.set(c.p,e);}
    else{e.cls='join';e.hire=parseYMD(ASSIGN_HIRE[e.key]);} // 캠퍼스만 지정된 이름 = 입사 예정자
  });
  R.entries=entries;
  // 4) 급여대장 인원
  Object.entries(PERSONS).forEach(([c,l])=>{if(c==='미분류')return;l.forEach(p=>{
    if(p.ignored)return;
    if(!String(p.payName||'').trim()&&!p.attendName){R.empty.push({campus:c,p});return;}
    const h=parseYMD(p.hireDate),lv=parseYMD(p.leaveDate),pos=p.posOverride||'';
    if(lv&&lv<WEEK.start){R.resigned++;R.resignedList.push({campus:c,pay:p.payName||'',formal:p.formalName||'',att:p.attendName||'',pos,lv,h});return;}
    if(!inPay(c,p)){R.notInPay.push({campus:c,pay:p.payName||'',att:p.attendName||'',pos});return;}
    const row={campus:c,group:groupKey(c),p,pay:p.payName||'',formal:p.formalName||'',att:p.attendName||'',pos,h,lv};
    const e=byPerson.get(p);row.entry=e||null;row.st=e?'ok':(!p.attendName?'noname':'nocaps');
    if(SKIP_POSITIONS.includes(pos))row.excl='제외 직책 ('+pos+')';
    else if(isSafety(pos))row.excl='안전선생님 (별도 관리)';
    else if(p.isLeave)row.excl='휴직';
    else if(p.isArCenter)row.excl='AR센터';
    else if(h&&h>WEEK.end){row.excl='입사 예정 ('+h+')';R.futureHires.push(row);}
    else if(lv&&!e)row.excl=`퇴사 (${lv}) · CAPS 기록 없음`;   // 입퇴사·이번 달 퇴사
    R.pay.push(row);
  });});
  R.pay.sort((a,b)=>a.campus.localeCompare(b.campus,'ko')||posRank(a.pos)-posRank(b.pos)||a.pay.localeCompare(b.pay,'ko'));
  // 전체근로자 명단 중복: 연결 안 된 줄인데 같은 캠퍼스(수지·수지2 묶음)에 같은 사람이 또 있음
  R.pay.forEach(r=>{
    if(r.excl||r.st==='ok')return;
    const k=personKey(r.pay),f=r.formal,a=r.att?strictKey(r.att):'';
    const tw=R.pay.filter(o=>o!==r&&o.group===r.group&&((k&&personKey(o.pay)===k)||(f&&o.formal===f)||(!r.pay&&a&&o.att&&strictKey(o.att)===a)));
    // 같은 사람 줄 중 연결된 줄이 있으면 그 줄을 남기고, 둘 다 연결 전이면 먼저 나온 줄 하나만 남김
    const keep=tw.find(o=>o.st==='ok')||tw.find(o=>R.pay.indexOf(o)<R.pay.indexOf(r)&&!o.dupOf&&!o.excl);
    if(keep)r.dupOf=keep;
  });
  entries.forEach(e=>{
    e.moved=[];if(!e.out||!['gone','gonePend','unsorted'].includes(e.cls))return;
    const ks=new Set([personKey(e.out.name),e.out.formal?normName(e.out.formal):''].filter(Boolean));
    R.pay.forEach((r,i)=>{if(r.p===e.out.p)return;if(ks.has(personKey(r.pay))||(r.formal&&ks.has(normName(r.formal))))e.moved.push(i);});
  });
  R.pay.forEach(r=>{if(!r.excl&&!r.dupOf&&r.st!=='ok'){r.needId=true;r.asked=!!r.p.capsAsk;}});
  // 급여대장에 있는 사람은 반드시 화면에 있어야 함 — 명단에서 빠져 있는 사람 찾기
  R.payMissing=[];
  if(PS){

    (R.resignedList||[]).forEach(r=>shown.add(r.campus+'|'+personKey(r.pay)));   // 급여대장상 퇴사(입퇴사)는 정상
    (PS.members||[]).forEach(m=>{
      const [c,t,n]=m.split('|');if(t!=='n'||!n)return;const k=personKey(n);if(!k||shown.has(c+'|'+k))return;shown.add(c+'|'+k);
      const recIgn=(PERSONS[c]||[]).find(p=>p.ignored&&personKey(p.payName)===k);
      const recUn=(PERSONS['미분류']||[]).find(p=>personKey(p.payName)===k);
      R.payMissing.push(recIgn?{campus:c,name:n,why:'ignored',rec:recIgn}:recUn?{campus:c,name:n,why:'unassigned',rec:recUn}:{campus:c,name:n,why:'missing'});
    });
    R.groups=sortCampuses([...new Set([...R.groups,...R.payMissing.map(m=>groupKey(m.campus))])]);
  }
  // 개수
  const C=k=>entries.filter(e=>e.cls===k).length;
  R.cnt={unsorted:C('unsorted'),join:C('join'),ask:C('ask'),gone:C('gone'),gonePend:C('gonePend'),hq:C('hq'),ignore:C('ignore'),campus:C('campus'),
    needId:R.pay.filter(r=>r.needId&&r.asked).length,needPend:R.pay.filter(r=>r.needId&&!r.asked).length+R.payMissing.length,payMissing:R.payMissing.length,dup:R.pay.filter(r=>r.dupOf).length};
  R.cnt.asks=R.cnt.needId+R.cnt.ask+R.cnt.gone;
  // 처리 필요 = ① CAPS ID 미생성(미확인) + ② 퇴사자 미삭제(미확인) + ③ 급여대장 내 이름 확인 불가
  R.todo=R.hasCaps?R.cnt.needPend+R.cnt.gonePend+R.cnt.unsorted:0;
  R.sig=sigOf(R)+(PS?PS.start:'');
  if(!R.hasCaps)return R;
  if(!full){ // 화면 갱신 때는 마지막 분석 결과를 그대로 보여줌
    if(ANA&&ANA.week===WEEK.key){Object.assign(R,{soe:ANA.soe,check:ANA.check,auto:ANA.auto,excl:ANA.excl,warn:ANA.warn,analyzed:true,stale:ANA.sig!==R.sig,anaAt:ANA.at});}
    return R;
  }
  R.analyzed=true;R.anaAt=new Date();
  // 5) 판정
  const loaded=new Set(CAPS.files.flatMap(f=>f.months));

  if(R.todo)R.warn.push(`인원 분류 "처리 필요" ${R.todo}명이 남아 판정·소명에서 빠졌습니다.`);
  if(R.cnt.dup)R.warn.push(`전체근로자 명단 중복 ${R.cnt.dup}줄은 판정에서 빠졌습니다 (점검 제외 탭에서 확인).`);
  if(!PS)R.warn.push(`이 주에 쓸 ${periodOf(WEEK.start).label} 급여대장이 없습니다. 주간 파일 업로드에서 올려 주세요.`);
  const lvIdx=new Map();
  LEAVES.forEach(l=>{const k=normName(l.name)+'|'+l.date;if(!lvIdx.has(k))lvIdx.set(k,[]);lvIdx.get(k).push(l);});
  const minMin=Math.round((CONFIG.minHours||8)*60);
  const judge=(base,entry,h,lv,att,names,why0)=>{
    const nw=(NONWORK[base.campus]||{})[att]||[];
    WEEK.dates.forEach(date=>{
      if(!loaded.has(date.slice(0,7))||isHoliday(date))return;
      const b={...base,date};

      if(lv&&date>lv){R.excl.push({...b,why:'퇴사 후'});return;}
      if(nw.includes(dowOf(date))){R.excl.push({...b,why:'비근무요일'});return;}
      const r=entry.rec[date],ci=r?r[0]:'',co=r?r[1]:'';
      const lvs=[...new Set(names.filter(Boolean).map(n=>normName(n)+'|'+date))].flatMap(k=>lvIdx.get(k)||[])
        .filter(l=>!l.campus||!normCampus(l.campus)||groupKey(normCampus(l.campus))===base.group).map(l=>l.type||'연차');

    });
  };

  const ask=(o)=>R.soe.push({scope:'person',date:WEEK.start,ci:'',co:'',position:'',...o});
  R.pay.forEach(row=>{
    const base={campus:row.campus,group:row.group,name:row.att||row.pay,payName:row.pay,position:row.pos};
    if(row.excl){R.excl.push({...base,date:'',why:row.excl});return;}

    judge(base,row.entry,row.h,row.lv,row.att,[stripMark(row.pay),row.formal,row.att],'');
  });
  let joinSkip=0;
  entries.forEach(e=>{
    if(e.cls==='join'){
      const first=WEEK.dates.find(d=>e.rec[d]&&(e.rec[d][0]||e.rec[d][1]));const h=e.hire||first;
      if(!h){joinSkip++;return;}
      judge({campus:e.campus,group:e.group,name:e.name,payName:'(입사 예정자)',position:''},e,h,'',e.name,[e.name],`입사 예정자 · ${e.hire?'입사일':'첫 CAPS 기록'} ${fmtMD(h)}부터`);
    }
    else if(e.cls==='gone')ask({campus:e.campus,group:e.group,name:e.name,payName:e.out?e.out.name:'',kind:'not_deleted',hint:e.why});
    else if(e.cls==='ask')ask({campus:e.campus,group:e.group,name:e.name,payName:'',kind:'unknown',hint:'CAPS에 있는 이름인데 급여대장에서 확인되지 않음'});
  });
  if(joinSkip)R.warn.push(`입사 예정자 중 입사일과 이번 주 기록이 모두 없는 ${joinSkip}명은 판정하지 않았습니다.`);
  return R;
}

// 급여대장 적용 기간 (매월 11일 ~ 다음 달 10일)
async function loadPayrolls(){try{const{db,collection,getDocs}=window._fb;const s=await getDocs(collection(db,'weekly_payrolls'));PAYROLLS=[];s.forEach(d=>PAYROLLS.push(d.data()));PAYROLLS.sort((a,b)=>b.start.localeCompare(a.start));}catch(e){PAYROLLS=[];}}
// 이 주에 적용되는 급여대장: 주 목요일이 기간 안에 있는 것, 없으면 그 전에 시작한 가장 최근 것
// M월 11일 ~ (M+1)월 10일 기간의 주는 (M-1)월 귀속 급여대장(M월 10일 완성)으로 점검. 걸친 주는 월요일 기준
function periodOf(d){
  const [y,m,dd]=d.split('-').map(Number);let Y=y,M=m;if(dd<11){M--;if(M<1){M=12;Y--;}}
  const start=`${Y}-${pad2(M)}-11`,e=new Date(Y,M,10),end=ymd(e);
  let BY=Y,BM=M-1;if(BM<1){BM=12;BY--;}
  return {start,end,belong:`${BY}-${pad2(BM)}`,label:`${BY!==Y?BY+'년 ':''}${BM}월 귀속`};
}
function payrollFor(){
  if(!WEEK)return null;
  const per=periodOf(WEEK.start);
  const ps=PAYROLLS.find(x=>x.start===per.start)||null;
  if(ps&&!ps._set){ps._set=new Set(ps.members||[]);(ps.members||[]).forEach(m=>{const [c,t,n]=m.split('|');if(t==='n')ps._set.add(c+'|k|'+personKey(n));});}
  return ps;
}

// 분석 이후 분류·파일·기준이 바뀌었는지 판단용
function sigOf(R){
  let s=[CONFIG.minHours,(CONFIG.holidays||[]).join(),JSON.stringify(NONWORK),LEAVES.length,CAPS.files.map(f=>f.name+f.persons.length).join()].join('|');
  R.pay.forEach(r=>{s+='|'+r.campus+r.pay+r.st+(r.excl||'')+r.att+(r.h||'')+(r.lv||'');});
  s+='|'+JSON.stringify(ASSIGN_HIRE);
  R.entries.forEach(e=>{s+='|'+e.key+e.cls+(e.campus||'');});
  let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h;
}

function detectMonth(fn){
  let m=fn.match(/(20\d{2})[-._ ]?(\d{1,2})월/);if(m)return `${m[1]}-${pad2(+m[2])}`;
  m=fn.match(/(20\d{2})[-._]?(0[1-9]|1[0-2])(?!\d)/);if(m)return `${m[1]}-${m[2]}`;
  m=fn.match(/(?:^|[^\d])(\d{1,2})월/);if(m){const hit=WEEK.months.find(x=>+x.slice(5)===+m[1]);if(hit)return hit;}
  return null;
}
function chooseMonth(fn){
  return new Promise(res=>{
    window._pickMonth=v=>{closeModal();res(v);};
    showModal(`<div class="ct">📅 몇 월 파일인가요?</div><p class="hint" style="margin-bottom:12px">${esc(fn)} — 파일 이름에서 월을 찾지 못했습니다.</p><div class="row">${WEEK.months.map(m=>`<button class="btn bp" onclick="_pickMonth('${m}')">${+m.slice(5)}월</button>`).join('')}<button class="btn bg" onclick="_pickMonth(null)">취소</button></div>`);
  });
}
function parseCaps(rows,month){
  let hi=-1;
  for(let i=0;i<Math.min(12,rows.length);i++){if(rows[i].some(c=>['이름','성명'].includes(String(c??'').trim()))){hi=i;break;}}
  if(hi<0)return {error:'"이름" 또는 "성명" 열을 찾지 못했습니다'};
  const hdr=rows[hi].map(c=>String(c??'').trim());
  const nameI=hdr.findIndex(h=>h==='이름'||h==='성명');
  const empI=hdr.findIndex(h=>['사원번호','사번','사원코드','번호','ID','id'].includes(h));
  const divI=hdr.findIndex(h=>h==='구분'||h==='출퇴근구분');
  const yr=+WEEK.start.slice(0,4);const cols=[];let needMonth=false;
  hdr.forEach((h,i)=>{
    if(i===nameI||i===empI||i===divI||!h)return;let m;
    if((m=h.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/)))cols.push({i,date:`${m[1]}-${pad2(+m[2])}-${pad2(+m[3])}`});
    else if((m=h.match(/^(\d{1,2})[\/.\-월]\s*(\d{1,2})/)))cols.push({i,date:`${yr}-${pad2(+m[1])}-${pad2(+m[2])}`});
    else if((m=h.match(/^(\d{1,2})(?:일|\s*\(.\))?$/))&&+m[1]>=1&&+m[1]<=31){cols.push({i,day:+m[1]});needMonth=true;}
  });
  if(!cols.length)return {error:'날짜 열(1~31 또는 날짜)을 찾지 못했습니다'};
  if(needMonth&&!month)return {needMonth:true};
  cols.forEach(c=>{if(c.day)c.date=`${month}-${pad2(c.day)}`;});
  const map=new Map(),outDone=new Set();let cur=null;
  for(let ri=hi+1;ri<rows.length;ri++){
    const r=rows[ri];
    const nm=String(r[nameI]??'').trim().replace(/\s+/g,' ');
    const dv=divI>=0?String(r[divI]??'').trim():'';
    const which=/퇴근/.test(dv)?1:/출근/.test(dv)?0:-1;
    if(nm){const e=empI>=0?String(r[empI]??'').trim():'';const k=nm+'|'+e;cur=map.get(k);if(!cur){cur={n:nm,e,r:{}};map.set(k,cur);}outDone.delete(cur);}
    else if(!cur||which!==1||outDone.has(cur))continue; // 이름 없는 행은 바로 위 사람의 '퇴근' 행만 인정 (빈 유령행 방지)
    cols.forEach(c=>{
      if(!WEEK.dates.includes(c.date))return;
      const v=String(r[c.i]??'').trim();if(!v||v==='0'||v==='-')return;
      const slot=cur.r[c.date]||['',''];
      if(which>=0){if(parseTime(v)!=null)slot[which]=v;}
      else{const ts=v.match(/\+?\d{1,2}:\d{2}/g)||[];if(ts[0])slot[0]=ts[0];if(ts[1])slot[1]=ts[1];}
      if(slot[0]||slot[1])cur.r[c.date]=slot;
    });
    if(which===1)outDone.add(cur);
  }
  const months=[...new Set(cols.map(c=>c.date.slice(0,7)))].filter(m=>WEEK.months.includes(m));
  return {persons:[...map.values()],months};
}
window.onCapsFiles=async function(input){
  const files=[...input.files];input.value='';if(!canEdit())return;
  try{await needXLSX();}catch(e){toast(e.message,1);return;}
  for(const file of files){
    try{
      const wb=XLSX.read(new Uint8Array(await file.arrayBuffer()),{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
      let month=detectMonth(file.name)||(WEEK.months.length===1?WEEK.months[0]:null);
      let res=parseCaps(rows,month);
      if(res.needMonth){month=await chooseMonth(file.name);if(!month)continue;res=parseCaps(rows,month);}
      if(res.error){toast(`${file.name}: ${res.error}`,1);continue;}
      if(!res.months.length){toast(`${file.name}: 이번 주(${fmtMD(WEEK.start)}~) 날짜가 없는 파일입니다`,1);continue;}
      CAPS.files=CAPS.files.filter(f=>!f.months.every(m=>res.months.includes(m)));

      toast(`${file.name}: ${res.persons.length}명 읽음`);
    }catch(e){toast(`${file.name} 읽기 실패: ${e.message}`,1);}
  }
  refresh();queueSave();
};

function parseLeaveRows(rows,sheet){
  let hi=-1;
  for(let i=0;i<Math.min(10,rows.length);i++){const c=rows[i].map(x=>String(x||'').trim());if(c.some(x=>/^(이름|성명|name)$/i.test(x))&&c.some(x=>/(날짜|일자|date|시작)/i.test(x))){hi=i;break;}}
  if(hi<0)return 0;
  const h=rows[hi].map(x=>String(x||'').trim());const f=re=>h.findIndex(x=>re.test(x));
  const nI=f(/^(이름|성명|name)$/i),cI=f(/(캠퍼스|campus|소속)/i),dI=f(/^(날짜|일자|date|사용일|휴가일)$/i),sI=f(/(시작|start)/i),eI=f(/(종료|end)/i),tI=f(/(종류|type|구분)/i),stI=f(/(상태|status)/i);
  let n=0;
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i];const name=String(r[nI]||'').trim();if(!name)continue;
    if(stI>=0){const s=String(r[stI]||'').trim();if(s&&!/승인|approved|완료/i.test(s))continue;}
    const campus=cI>=0?String(r[cI]||'').trim():(normCampus(sheet)?sheet:'');
    const type=tI>=0?String(r[tI]||'').trim()||'연차':'연차';
    let dates=[];
    if(dI>=0){const d=parseYMD(r[dI]);if(d)dates=[d];}
    else if(sI>=0){const s=parseYMD(r[sI]),e=eI>=0?(parseYMD(r[eI])||s):s;if(s){let c=s,g=0;while(c<=e&&g++<62){dates.push(c);const [y,m,d]=c.split('-').map(Number);c=ymd(new Date(y,m-1,d+1));}}}
    dates.filter(d=>d>=WEEK.start&&d<=WEEK.end).forEach(d=>{LEAVES.push({name,campus,date:d,type,src:'file'});n++;});
  }
  return n;
}

window.applyPayroll=async function(){

// 급여대장 인원(D.pay[pi]) ↔ CAPS 이름(D.entries[ei]) 연결
async function linkPair(pi,ei,silent){
  if(!canEdit())return false;
  const row=D.pay[pi],e=D.entries[ei];if(!row||!e)return false;
  const sk=strictKey(e.name),touched=new Set([row.campus]);
  // 같은 CAPS 이름이 다른 사람에게 연결돼 있으면 옮김 (퇴사·입사예정 기록은 그대로)
  const others=e.dup?[]:Object.entries(PERSONS).flatMap(([c,l])=>l.map(p=>({c,p}))).filter(x=>x.p!==row.p&&!x.p.ignored&&x.p.attendName&&strictKey(x.p.attendName)===sk&&!['퇴사','입사'].some(w=>outOf(x.p).startsWith(w)));
  if(others.length){
    if(!silent&&!confirm(`"${e.name}"은(는) 이미 ${others.map(o=>o.c+' '+(o.p.payName||'(이름 없음)')).join(', ')}에게 연결돼 있습니다.\n${row.campus} ${row.pay}(으)로 옮길까요?`))return false;
    others.forEach(o=>{o.p.attendName=null;o.p.matchType='none';touched.add(o.c);});
  }
  row.p.attendName=e.name;row.p.matchType='manual';delete row.p.capsAsk;
  if(e.empId)row.p.attendEmp=e.empId;else delete row.p.attendEmp;
  let a=false;
  if(e.dup){if(ASSIGN[e.key]!==row.campus){ASSIGN[e.key]=row.campus;a=true;}}
  else if(ASSIGN[e.key]){delete ASSIGN[e.key];a=true;}
  if(ASSIGN_HIRE[e.key]){delete ASSIGN_HIRE[e.key];a=true;}
  for(const c of touched)await savePersons(c);
  if(a)await saveAssign();
  if(!silent){toast(`${row.pay} ↔ ${e.name} 연결`);refresh();}
  return true;
}

  else if(v==='ign')await setAssign(e.key,'__ignore',`${e.name} → 점검 대상 제외`);
  else if(v==='ar')await setAssign(e.key,'__ar',`${e.name} → AR센터 (점검 제외)`);
  else if(v==='hq')await setAssign(e.key,'__hq',`${e.name} → 본사`);

window.onPayPick=async function(sel,pi){
  const v=sel.value;sel.value='';if(!v)return;
  if(v.startsWith('e:')){await linkPair(pi,+v.slice(2));return;}
  if(v==='custom'){

    row.p.attendName=name.trim().replace(/\s+/g,' ');row.p.matchType='manual';delete row.p.capsAsk;await savePersons(row.campus);toast('저장됨');refresh();

// 이름이 같은 급여대장 인원 ↔ CAPS 이름 (서로 하나씩만 있을 때) → 자동 연결 대상
function exactPairs(){
  const free=D.entries.map((e,i)=>({e,i})).filter(x=>['unsorted','join','ask'].includes(x.e.cls));
  const out=[];const usedE=new Set();
  D.pay.forEach((r,pi)=>{
    if(!r.needId)return;
    const ks=[personKey(r.pay),r.formal?normName(r.formal):''].filter(Boolean);if(!ks.length)return;
    const c=free.filter(x=>ks.includes(normName(x.e.name))&&(x.e.cls==='unsorted'?((!x.e.dup)&&(!x.e.guess||groupKey(x.e.guess)===r.group)):x.e.group===r.group));
    if(c.length!==1||usedE.has(c[0].i))return;
    const rivals=D.pay.filter(o=>o!==r&&o.needId&&[personKey(o.pay),o.formal?normName(o.formal):''].some(v=>v&&ks.includes(v))&&(c[0].e.cls==='unsorted'||o.group===r.group));
    if(rivals.length)return;
    usedE.add(c[0].i);out.push({pi,ei:c[0].i});
  });
  return out;
}
// 자동 연결: 이름이 정확히 같은 1:1 짝 (입사 예정자가 급여대장에 들어온 경우 포함)
let _autoBusy=false,_autoSig='';
async function autoResolve(){
  if(_autoBusy||!READY||!canEdit()||!D||!D.hasCaps||!Object.keys(PERSONS).length)return;
  const pairs=exactPairs();if(!pairs.length)return;
  const sig=pairs.map(x=>D.pay[x.pi].campus+D.pay[x.pi].pay+'='+D.entries[x.ei].key).join('|');if(sig===_autoSig)return;
  _autoBusy=true;_autoSig=sig;
  try{
    const aff=new Set();let a=false;
    pairs.forEach(({pi,ei})=>{const r=D.pay[pi],e=D.entries[ei];r.p.attendName=e.name;r.p.matchType='manual';delete r.p.capsAsk;if(e.empId)r.p.attendEmp=e.empId;aff.add(r.campus);if(ASSIGN[e.key]){delete ASSIGN[e.key];a=true;}if(ASSIGN_HIRE[e.key]){delete ASSIGN_HIRE[e.key];a=true;}});
    for(const c of aff)await savePersons(c);if(a)await saveAssign();
    toast(`이름이 같은 ${pairs.length}명 자동 연결`);
  }finally{_autoBusy=false;refresh();}
}

// ── 발행 ──
async function ensureToken(c){
  if(TOKENS[c])return TOKENS[c];
  const t=randomToken();const{db,doc,setDoc}=window._fb;
  await setDoc(doc(db,'weekly_tokens',c),{campus:c,token:t,createdAt:new Date().toISOString()});
  await setDoc(doc(db,'weekly_campus',t),{campus:c,createdAt:new Date().toISOString()});
  TOKENS[c]=t;return t;
}
window.publish=async function(){
  if(!canEdit())return;
  if(!D.payroll){alert(`${periodOf(WEEK.start).label} 급여대장이 없어 발행할 수 없습니다.`);switchTab('prep');return;}
  if(!D.analyzed){toast('먼저 분석을 실행하세요',1);return;}
  if(D.stale&&!confirm('분석한 뒤에 인원 분류·파일이 바뀌었습니다.\n이전 분석 결과로 발행할까요?\n\n(취소 → "다시 분석" 후 발행하면 최신 결과로 나갑니다)'))return;
  if(D.todo){alert(`인원 분류 "처리 필요"에 ${D.todo}명이 남아 있습니다.\n모두 분류한 뒤 다시 분석하고 발행하세요.`);PSUB='todo';switchTab('people');return;}
  if(!D.soe.length){toast('소명 필요 건이 없습니다',1);return;}
  const by={};D.soe.forEach(r=>{(by[r.campus]=by[r.campus]||[]).push(r);});
  const camps=Object.keys(by);
  if(!confirm(`${fmtMD(WEEK.start)}~${fmtMD(WEEK.end)} 소명 요청 ${D.soe.length}건을 ${camps.length}개 캠퍼스 링크에 올립니다.\n이미 회신한 건은 그대로 두고, 이번 결과에서 사라진 미회신 건은 지웁니다.`))return;
  const{db,doc,collection,getDocs,query,where,writeBatch,setDoc}=window._fb;
  let created=0,kept=0,removed=0;stamp('발행 중…');
  try{
    // 결과에서 빠진 캠퍼스의 미회신 건도 정리
    const all=new Set([...camps,...Object.keys(TOKENS)]);
    for(const c of all){
      const list=by[c]||[];
      if(!list.length&&!TOKENS[c])continue;
      const token=await ensureToken(c);
      const col=collection(db,'weekly_campus',token,'items');
      const snap=await getDocs(query(col,where('weekKey','==',WEEK.key)));
      const ex=new Map();snap.forEach(d=>ex.set(d.id,d.data()));
      const want=new Set();let batch=writeBatch(db),n=0;
      const flush=async()=>{if(n){await batch.commit();batch=writeBatch(db);n=0;}};
      for(const r of list){
        const id=r.scope==='person'?itemId(WEEK.key,'P-'+r.kind,r.name):itemId(WEEK.key,r.date,r.name);want.add(id);
        batch.set(doc(col,id+'__ev'),{type:'evidence',itemId:id,evWeek:WEEK.key,campus:c},{merge:true});n++;
        if(ex.has(id)){kept++;}
        else{batch.set(doc(col,id),{weekKey:WEEK.key,weekStart:WEEK.start,weekEnd:WEEK.end,campus:c,name:r.name,payName:r.payName,position:r.position,date:r.date,dow:r.scope==='person'?'':DOW[dowOf(r.date)],scope:r.scope||'day',kind:r.kind,ci:r.ci||'',co:r.co||'',hint:r.hint||'',status:'open',reason:'',memo:'',evidenceCount:0,createdAt:new Date().toISOString(),createdBy:user.email});created++;n++;}
        if(n>=400)await flush();
      }

function renderHistory(){
  if(!RUNS.length){$('p-history').innerHTML='<div class="card empty"><div class="i">💾</div><b>기록이 없습니다</b><p class="hint">파일을 올리고 분석하면 그 주차가 기록됩니다.</p></div>';return;}
  $('p-history').innerHTML=`<div class="box b-info">CAPS·연차 파일은 올리는 순간, 분석 요약은 분석할 때 자동 저장되고, 소명 회신·사진·승인 기록은 계속 남습니다. 주차를 누르면 그 주로 이동합니다. 사진이 저장 용량(무료 1GB)을 차지하므로 검토가 끝난 주차는 <b>🧹 사진 정리</b>로 승인 건의 사진만 지울 수 있습니다.</div>
  <div class="tw"><table><thead><tr><th>주차</th><th>소명 필요</th><th>짧은 근무</th><th>분류 미처리</th><th>발행</th><th>최근 저장</th><th></th></tr></thead><tbody>${RUNS.map(r=>{const a=r.analysis||{};return `<tr style="${r.weekKey===WEEK.key?'background:var(--pri-lt)':''}"><td class="mono"><b>${fmtMD(r.start)} ~ ${fmtMD(r.end)}</b></td><td>${a.soe??'-'}</td><td>${a.check??'-'}</td><td>${a.unmatched?`<span class="chip c-red">${a.unmatched}</span>`:'0'}</td><td>${r.publishedAt?`<span class="chip c-grn">${r.total}건 · ${r.publishedAt.slice(5,10)}</span>`:'<span class="chip c-gry">미발행</span>'}</td><td class="mono">${(r.savedAt||r.publishedAt||'').slice(0,16).replace('T',' ')}</td><td style="white-space:nowrap"><button class="btn bg sm" onclick="setWeek('${r.start}').then(()=>switchTab('prep'))">📂 열기</button> ${r.publishedAt?`<button class="btn bg sm" onclick="setWeek('${r.start}').then(()=>switchTab('review'))">📨 검토</button> <button class="btn bg sm edit" onclick="cleanupEv('${r.weekKey}')">🧹 사진 정리</button>`:''}</td></tr>`;}).join('')}</tbody></table></div>`;
}
window.cleanupEv=async function(wk){
  if(!confirm(`${fmtMD(wk)} 주차의 "승인" 건 사진을 모두 지웁니다. 사유·메모·승인 기록은 남습니다. 되돌릴 수 없습니다.`))return;
  const{db,doc,collection,getDocs,query,where,writeBatch}=window._fb;let n=0;
  try{
    for(const t of Object.values(TOKENS)){
      const col=collection(db,'weekly_campus',t,'items');
      const s=await getDocs(query(col,where('weekKey','==',wk),where('status','==','approved')));
      let b=writeBatch(db),c=0;
      for(const d of s.docs){const x=d.data();if(!(x.evidenceCount>0)&&!(x.evidence||[]).length)continue;b.set(doc(col,d.id+'__ev'),{images:[],clearedAt:new Date().toISOString()},{merge:true});b.update(doc(col,d.id),{evidenceCount:0,evidence:[],evidenceCleared:true});delete EVCACHE[d.id];n++;c+=2;if(c>=400){await b.commit();b=writeBatch(db);c=0;}}
      if(c)await b.commit();
    }
    toast(`사진 정리 ${n}건`);if(wk===WEEK.key)loadReview();
  }catch(e){toast('정리 실패: '+e.message,1);}
};

// ═════════════════════════════════════════════
// ⚙️ 설정
// ═════════════════════════════════════════════
async function loadConfig(){try{const{db,doc,getDoc}=window._fb;const s=await getDoc(doc(db,'weekly_config','main'));if(s.exists())CONFIG={minHours:8,holidays:[],...s.data()};}catch(e){}}
async function loadNonwork(){try{const{db,collection,getDocs}=window._fb;const s=await getDocs(collection(db,'weekly_nonwork'));NONWORK={};s.forEach(d=>{NONWORK[d.id]=d.data().map||{};});}catch(e){}}
async function saveNonworkCampus(c){const{db,doc,setDoc}=window._fb;await setDoc(doc(db,'weekly_nonwork',c),{campus:c,map:NONWORK[c]||{},updatedAt:new Date().toISOString()});}
async function loadTokens(){try{const{db,collection,getDocs}=window._fb;const s=await getDocs(collection(db,'weekly_tokens'));TOKENS={};s.forEach(d=>{TOKENS[d.id]=d.data().token;});}catch(e){}}
let NWC='';
function renderSettings(){
  const camps=sortCampuses(Object.keys(PERSONS).filter(c=>c!=='미분류'));
  if(!camps.includes(NWC))NWC=camps[0]||'';
  const linkCamps=sortCampuses([...new Set([...camps,...Object.keys(TOKENS)])]);
  $('p-settings').innerHTML=`<div class="grid2">
    <div class="card" style="margin:0"><div class="ct">⏱ 짧은 근무 기준</div><p class="hint" style="margin-bottom:8px">출근~퇴근 체류시간이 이 시간 미만이면 "짧은 근무"로 표시 (정규 9시간, 1시간 여유).</p>
      <div class="row"><input type="number" id="cfg-mh" min="1" max="12" step="0.5" value="${CONFIG.minHours}" style="width:80px"> 시간 미만 <button class="btn bp sm edit" onclick="saveConfig()">저장</button></div>
      <div class="ct" style="margin-top:16px">📅 추가 공휴일·휴원일 <span class="sub">한 줄에 하나, YYYY-MM-DD</span></div>
      <textarea id="cfg-hol" placeholder="2026-12-31">${esc((CONFIG.holidays||[]).join('\n'))}</textarea><div style="margin-top:8px"><button class="btn bp sm edit" onclick="saveConfig()">저장</button></div></div>
    <div class="card" style="margin:0"><div class="ct">🔗 원장 소명 페이지 링크 <span class="sub">캠퍼스마다 고정 1개 · 새면 재발급</span></div>
      <div class="tw" style="max-height:330px"><table><tbody>${linkCamps.map(c=>`<tr><td><b>${esc(c)}</b></td><td>${TOKENS[c]?'<span class="chip c-grn">발급됨</span>':'<span class="hint">발행 시 자동 생성</span>'}</td><td style="white-space:nowrap;text-align:right">${TOKENS[c]?`<button class="btn bg sm" onclick="copyLink('${esc(c)}')">📋 복사</button> `:''}<button class="btn bg sm edit" onclick="issueToken('${esc(c)}')">${TOKENS[c]?'재발급':'발급'}</button></td></tr>`).join('')}</tbody></table></div></div>
  </div>
  <div class="card" style="margin-top:14px"><div class="ct">📆 비근무요일 <span class="sub">단시간 근로자 등 — 지정한 요일 빈칸은 소명 대상에서 빠짐. 소명 검토에서 "비근무요일" 승인 시 매주 반복으로 자동 등록</span></div>
    <div class="row" style="margin-bottom:10px"><select onchange="NWC=this.value;renderSettings()">${camps.map(c=>`<option ${c===NWC?'selected':''}>${esc(c)}</option>`).join('')}</select><span class="sp"></span><button class="btn bp sm edit" onclick="saveNonwork()">💾 ${esc(NWC)} 저장</button></div>
    <div class="tw" style="max-height:460px"><table><thead><tr><th>CAPS 이름</th><th>급여대장 이름</th><th>직책</th><th>비근무요일</th></tr></thead><tbody>${(PERSONS[NWC]||[]).filter(p=>p.attendName&&!p.ignored).map(p=>{const a=(NONWORK[NWC]||{})[p.attendName]||[];return `<tr><td><b>${esc(p.attendName)}</b></td><td>${esc(p.payName||'')}</td><td>${esc(p.posOverride||'')}</td><td><span class="dows">${[1,2,3,4,5].map(d=>`<label class="${a.includes(d)?'on':''}"><input type="checkbox" ${a.includes(d)?'checked':''} onchange="toggleNW(${JSON.stringify(p.attendName).replace(/"/g,'&quot;')},${d},this.checked)">${DOW[d]}</label>`).join('')}</span></td></tr>`;}).join('')||'<tr><td colspan="4" class="hint">CAPS 이름이 연결된 인원이 없습니다</td></tr>'}</tbody></table></div></div>`;
}
window.toggleNW=function(name,d,on){NONWORK[NWC]=NONWORK[NWC]||{};let a=NONWORK[NWC][name]||[];a=on?[...new Set([...a,d])].sort():a.filter(x=>x!==d);if(a.length)NONWORK[NWC][name]=a;else delete NONWORK[NWC][name];renderSettings();};
window.saveNonwork=async()=>{if(!canEdit())return;try{await saveNonworkCampus(NWC);toast(`${NWC} 비근무요일 저장`);refresh();}catch(e){toast('저장 실패: '+e.message,1);}};
window.saveConfig=async function(){
  if(!canEdit())return;
  CONFIG={...CONFIG,minHours:parseFloat($('cfg-mh').value)||8,holidays:$('cfg-hol').value.split(/\n/).map(parseYMD).filter(Boolean),updatedAt:new Date().toISOString(),updatedBy:user.email};
  try{const{db,doc,setDoc}=window._fb;await setDoc(doc(db,'weekly_config','main'),CONFIG);toast('기준 저장됨');renderSettings();refresh();}catch(e){toast('저장 실패: '+e.message,1);}
};
window.issueToken=async function(c){
  if(!canEdit())return;
  if(TOKENS[c]&&!confirm(`${c} 링크를 재발급합니다. 이전 링크는 즉시 쓸 수 없고, 이전 링크의 소명 내역은 새 링크에서 보이지 않습니다. 계속할까요?`))return;
  try{const{db,doc,deleteDoc}=window._fb;const old=TOKENS[c];delete TOKENS[c];await ensureToken(c);if(old){try{await deleteDoc(doc(db,'weekly_campus',old));}catch(e){}}renderSettings();toast(`${c} 링크 발급됨`);}
  catch(e){toast('발급 실패: '+e.message,1);}
};
</script>
