let CAPS={files:[]};        // files:[{name,months:[],persons:[{n,e,r:{date:[ci,co]}}]}] — 이번 주 날짜만 보관
let LEAVES=[];              // [{name,campus,date,type,src}]
let PERSONS={};             // workers_persons 마스터 (전체 근로자와 공유, 실시간)
let ASSIGN={};              // CAPS키 → 캠퍼스 | '__hq' | '__ignore' | '__nothq'  (weekly_config/assign)
let HQSTAFF=[];             // 본사 근태(hq) 직원명단 이름
let CONFIG={minHours:8,holidays:[]};
let NONWORK={}, TOKENS={}, RUNS=[], ITEMS=[], ITEMS_WEEK='';
let D=null;
let ANA=null;               // 마지막 분석 결과 (분석 버튼을 눌러야 갱신)                 // 파생 결과

const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function toast(m,err){const t=$('toast');t.textContent=m;t.className='toast on'+(err?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',3200);}
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
function parseYMD(s){const m=String(s||'').match(/(\d{4})\D{0,2}(\d{1,2})\D{0,2}(\d{1,2})/);return m?`${m[1]}-${pad2(+m[2])}-${pad2(+m[3])}`:'';}
function dowOf(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).getDay();}
function fmtMD(s){if(!s)return '';const [y,m,d]=s.split('-');return `${+m}/${+d}(${DOW[dowOf(s)]})`;}
function isHoliday(s){return HOLIDAYS.has(s)||(CONFIG.holidays||[]).includes(s);}
// 몇 주차: 그 주 목요일이 속한 달 기준 (월이 걸친 주도 하나의 달로)
function weekNo(mon){const [y,m,d]=mon.split('-').map(Number);const th=new Date(y,m-1,d+3);return `${th.getFullYear()}년 ${th.getMonth()+1}월 ${Math.ceil(th.getDate()/7)}주차`;}
// 이번 주 기준 재직기간 밖·휴직
function outOf(p){const h=parseYMD(p.hireDate),lv=parseYMD(p.leaveDate);if(lv&&lv<WEEK.start)return `퇴사 (${lv})`;if(h&&h>WEEK.end)return `입사 예정 (${h})`;if(p.isLeave)return '휴직';return '';}
function canEdit(){return ROLE==='owner'||ROLE==='admin';}
function sortCampuses(a){return [...a.filter(c=>!MPOLY.includes(c)).sort((x,y)=>x.localeCompare(y,'ko')),...MPOLY.filter(c=>a.includes(c))];}
function normCampus(n){if(!n)return null;n=String(n).trim();if(CAMPUS_ALIASES[n])return CAMPUS_ALIASES[n];for(const k of Object.keys(CAMPUS_ALIASES).sort((a,b)=>b.length-a.length)){if(n.toLowerCase().includes(k.toLowerCase()))return CAMPUS_ALIASES[k];}return null;}
function campusGroup(c){return MERGE_GROUPS.find(g=>g.includes(c))||[c];}
function groupKey(c){const g=MERGE_GROUPS.find(g=>g.includes(c));return g?g[0]:c;}
// 대소문자·공백·전각/반각 차이만 무시 (괄호·부분일치는 같은 사람으로 보지 않음)
function strictKey(n){return String(n||'').normalize('NFKC').replace(/[\s\u200b-\u200d\ufeff]+/g,' ').trim().toLowerCase();}
function baseName(n){return String(n||'').trim().replace(/\s*[\(（][^)）]*[\)）]/g,'').replace(/\s+/g,' ').trim();}
function normName(n){return strictKey(baseName(n));}
// "09:02", "9:02:15", "+01:30"(익일) → 분. 실패 null
function parseTime(v){
  if(v==null||v==='')return null;
  const s=String(v).trim();const next=s.startsWith('+');
  let m=s.match(/(\d{1,2}):(\d{2})/);
  if(m)return (+m[1])*60+(+m[2])+(next?1440:0);
  m=s.match(/^(\d{2})(\d{2})$/);if(m)return (+m[1])*60+(+m[2]);
  const n=parseFloat(s);if(!isNaN(n)&&n>0&&n<1)return Math.round(n*1440);
  return null;
}
function itemId(wk,date,name){return `${wk}_${date}_${String(name).replace(/[\/\.#$\[\]]/g,'_')}`;}
function randomToken(){const a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(36).padStart(2,'0')).join('').slice(0,22);}
function loadScript(src,test){return new Promise((res,rej)=>{if(test())return res();const s=document.createElement('script');s.src=src;s.onload=()=>res();s.onerror=()=>rej(new Error('모듈 로드 실패'));document.head.appendChild(s);});}
const needXLSX=()=>loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',()=>!!window.XLSX);
const needSB=()=>loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',()=>!!window.supabase);
function showModal(html){$('modal').innerHTML=html;$('mbg').classList.add('on');}
function closeModal(){$('mbg').classList.remove('on');}
function stamp(msg){$('sync').textContent=msg;}

  onAuthStateChanged(auth,async u=>{
    if(!u){
      if(location.protocol==='file:'){document.body.style.opacity=1;document.querySelector('.content').innerHTML='<div class="card"><div class="empty"><div class="i">🔒</div><b>GitHub에 올린 뒤 로그인해서 사용하세요</b><p class="hint">weekly_attendant.html · weekly_campus_reply.html 을 저장소 루트에 올리고 사이트 주소로 접속합니다.</p></div></div>';return;}
      location.href='index.html';return;
    }
    user=u;

    try{const{db,doc,getDoc}=window._fb;const s=await getDoc(doc(db,'Users',u.email));ROLE=s.exists()?(s.data().role||'report'):'report';}catch(e){ROLE='report';}
    $('me-r').textContent={owner:'👑 Owner',admin:'🔧 관리자',report:'📊 리포트'}[ROLE]||'📊 리포트';

// 실시간 구독: 전체 근로자에서 바꾼 매칭·본사 명단이 바로 반영됨
function subscribe(){
  const{db,doc,collection,onSnapshot}=window._fb;
  onSnapshot(collection(db,'workers_persons'),snap=>{
    const P={};snap.forEach(d=>{const x=d.data();if(x.campus&&Array.isArray(x.persons))P[x.campus]=x.persons;});
    PERSONS=P;stamp(`인원 마스터 ${Object.keys(P).length}개 캠퍼스 · ${Object.values(P).reduce((a,l)=>a+l.length,0)}명`);refresh();
  },e=>{stamp('인원 마스터 불러오기 실패');toast('인원 마스터 불러오기 실패: '+e.message,1);});
  onSnapshot(doc(db,'weekly_config','assign'),s=>{ASSIGN=s.exists()?(s.data().map||{}):{};refresh();},()=>{});
  onSnapshot(doc(db,'config','staff'),s=>{HQSTAFF=s.exists()?(s.data().list||[]).filter(x=>!x.resigned).map(x=>x.name):[];refresh();},()=>{HQSTAFF=[];});
}

window.setWeek=async function(s){
  if(!s)return;
  const [y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d);
  const mon=new Date(dt);mon.setDate(dt.getDate()-((dt.getDay()+6)%7));
  const dates=[];for(let i=0;i<5;i++){const x=new Date(mon);x.setDate(mon.getDate()+i);dates.push(ymd(x));}
  WEEK={key:dates[0],start:dates[0],end:dates[4],dates,months:[...new Set(dates.map(x=>x.slice(0,7)))]};
  $('wk-pick').value=dates[0];$('wk-no').textContent=weekNo(dates[0]);$('wk-label').textContent=`${fmtMD(dates[0])} ~ ${fmtMD(dates[4])}`;
  CAPS={files:[]};LEAVES=[];ITEMS=[];ITEMS_WEEK='';ANA=null;D=derive();renderBadges();renderTab();
  await loadWeekInputs();
  if(TAB==='review')loadReview();
};
window.shiftWeek=n=>{const [y,m,d]=WEEK.start.split('-').map(Number);setWeek(ymd(new Date(y,m-1,d+7*n)));};

// ═════════════════════════════════════════════
// 주차 입력 저장/복원 (CAPS·연차) — 업로드하면 자동 저장
// ═════════════════════════════════════════════
const CAPS_DOC=wk=>`${wk}__v2`;
async function loadWeekInputs(){
  const wk=WEEK.key;const{db,doc,getDoc,collection,getDocs,query,where}=window._fb;
  try{
    const [snap,lv]=await Promise.all([getDocs(query(collection(db,'weekly_caps'),where('weekKey','==',wk))),getDoc(doc(db,'weekly_leaves',wk))]);
    if(WEEK.key!==wk)return;
    let v2=null;const legacy=[];
    snap.forEach(d=>{const x=d.data();if(x.format==='v2')v2=x;else legacy.push(x);});
    if(v2){CAPS={files:(v2.files||[]).map(f=>({name:f.name,months:f.months||[],persons:(f.persons||[]).map(p=>({n:p.n,e:p.e||'',r:Object.fromEntries(Object.entries(p.r||{}).map(([k,v])=>[k,String(v).split('|')]))}))}))};}
    else if(legacy.length){ // 이전 버전(캠퍼스별 저장)을 새 형식으로 변환
      CAPS={files:legacy.map(f=>({name:f.name+' (이전 저장본)',months:[f.month],persons:(f.persons||[]).map(p=>{const r={};WEEK.dates.forEach(dt=>{if(dt.slice(0,7)!==f.month)return;const day=+dt.slice(8);const ci=(p.ci||{})[day]||'',co=(p.co||{})[day]||'';if(ci||co)r[dt]=[ci,co];});return {n:p.name,e:p.empId||'',r};})}))};
    }else CAPS={files:[]};
    LEAVES=lv.exists()?(lv.data().leaves||[]):[];
  }catch(e){toast('주차 저장본 불러오기 실패: '+e.message,1);}
  refresh();
}
let _saveT=0;
function queueSave(){clearTimeout(_saveT);_saveT=setTimeout(saveWeekInputs,500);}
async function saveWeekInputs(){
  if(!canEdit()||!WEEK)return;
  const{db,doc,setDoc}=window._fb;
  try{
    const files=CAPS.files.map(f=>({name:f.name,months:f.months,persons:f.persons.map(p=>({n:p.n,e:p.e||'',r:Object.fromEntries(Object.entries(p.r).map(([k,v])=>[k,v.join('|')]))}))}));
    const body={weekKey:WEEK.key,format:'v2',files,savedAt:new Date().toISOString(),savedBy:user.email};
    if(JSON.stringify(body).length>950000){toast('CAPS 데이터가 너무 커서 저장하지 못했습니다 (1MB 제한). 이번 주 날짜가 있는 파일만 올려 주세요',1);return;}
    await setDoc(doc(db,'weekly_caps',CAPS_DOC(WEEK.key)),body);
    await setDoc(doc(db,'weekly_leaves',WEEK.key),{weekKey:WEEK.key,leaves:LEAVES,savedAt:new Date().toISOString()});
    stamp('저장됨 '+new Date().toTimeString().slice(0,5));
  }catch(e){toast('자동 저장 실패: '+e.message,1);}
}
async function saveRunSummary(){
  if(!D||!D.analyzed||!CAPS.files.length)return;
  const{db,doc,setDoc}=window._fb;
  const analysis={soe:D.soe.length,check:D.check.length,auto:D.auto.length,unmatched:D.todo};
  const now=new Date().toISOString();
  await setDoc(doc(db,'weekly_runs',WEEK.key),{weekKey:WEEK.key,start:WEEK.start,end:WEEK.end,analysis,savedAt:now,savedBy:user.email},{merge:true});
  const ex=RUNS.find(r=>r.weekKey===WEEK.key);
  if(ex)Object.assign(ex,{analysis,savedAt:now});else{RUNS.push({weekKey:WEEK.key,start:WEEK.start,end:WEEK.end,analysis,savedAt:now});RUNS.sort((a,b)=>b.weekKey.localeCompare(a.weekKey));}
}

// ═════════════════════════════════════════════
// 핵심: 인원 분류 + 누락 판정 (입력이 바뀔 때마다 전체 재계산)
// ═════════════════════════════════════════════
function derive(full){
  const R={entries:[],pay:[],soe:[],check:[],auto:[],excl:[],warn:[],groups:[],todo:0,hasCaps:CAPS.files.length>0,resigned:0};
  if(!WEEK)return R;
  R.groups=sortCampuses([...new Set(Object.keys(PERSONS).filter(c=>c&&c!=='미분류').map(groupKey))]);
  // 1) CAPS 항목 합치기 (이름+사번 기준)
  const em=new Map();
  CAPS.files.forEach(f=>f.persons.forEach(p=>{const k=p.n+'|'+(p.e||'');let e=em.get(k);if(!e){e={key:k,name:p.n,empId:p.e||'',rec:{}};em.set(k,e);}Object.entries(p.r).forEach(([d,v])=>{const o=e.rec[d]||['',''];e.rec[d]=[v[0]||o[0],v[1]||o[1]];});}));
  const entries=[...em.values()].sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  const nameCnt={};entries.forEach(e=>{const s=strictKey(e.name);nameCnt[s]=(nameCnt[s]||0)+1;});
  const linkIdx=new Map(),ignIdx=new Map(),payIdx=new Map(),outIdx=new Map();
  Object.entries(PERSONS).forEach(([c,l])=>l.forEach(p=>{
    const out=p.ignored?'':outOf(p),gone=out&&out!=='휴직';
    if(out)[p.payName,p.attendName].filter(Boolean).forEach(n=>{const k=normName(n);if(!outIdx.has(k))outIdx.set(k,{campus:c,why:out,name:p.payName||n});});
    // 퇴사·입사예정 인원의 CAPS 이름은 연결로 보지 않음 → 캠퍼스 이동·재입사 때 "여러 캠퍼스" 충돌 방지
    if(p.attendName&&!gone){const s=strictKey(p.attendName);const m=p.ignored?ignIdx:linkIdx;if(!m.has(s))m.set(s,[]);m.get(s).push({campus:c,p});}
    else if(!p.attendName&&!p.ignored&&p.payName&&!out){const k=normName(p.payName);if(!payIdx.has(k))payIdx.set(k,new Set());payIdx.get(k).add(c);}
  }));
  const assignedName=new Set(entries.filter(e=>ASSIGN[e.key]&&!ASSIGN[e.key].startsWith('__')).map(e=>strictKey(e.name)));
  const hqSet=new Set(HQSTAFF.map(strictKey));
  // 2) CAPS 항목 분류: 캠퍼스 / 본사 / 점검 제외 / 미분류
  entries.forEach(e=>{
    const s=strictKey(e.name),a=ASSIGN[e.key],dup=nameCnt[s]>1;
    e.dup=dup;
    e.active=WEEK.dates.some(d=>e.rec[d]&&(e.rec[d][0]||e.rec[d][1]));
    const links=linkIdx.get(s)||[],lg=[...new Set(links.map(x=>groupKey(x.campus)))];
    const pc=payIdx.get(normName(e.name));const pg=pc?[...new Set([...pc].map(groupKey))]:[];
    e.guess=pg.length===1?[...pc][0]:'';
    if(a==='__hq'){e.cls='hq';e.src='직접 지정';}
    else if(a==='__ignore'){e.cls='ignore';e.why='점검 대상 아님 (직접 지정)';}
    else if(a&&!a.startsWith('__')){e.cls='campus';e.campus=a;e.group=groupKey(a);}
    else if(!dup&&lg.length===1){e.cls='campus';e.group=lg[0];e.campus=links[0].campus;}
    else if(lg.length>1){e.cls='unsorted';e.why=`같은 CAPS 이름이 여러 캠퍼스 인원에 연결됨 (${links.map(x=>x.campus+' '+x.p.payName).join(', ')}) — 맞는 사람을 고르면 나머지 연결은 해제됩니다`;}
    else if(dup){e.cls='unsorted';e.why=assignedName.has(s)?`같은 이름의 CAPS 계정이 하나 더 있음 — 같은 사람의 중복 계정이면 "점검 대상 아님", 다른 사람이면 연결`:`동명이인(같은 이름 ${nameCnt[s]}명) — 사번 보고 캠퍼스를 지정하세요`;if(lg.length===1)e.guess=links[0].campus;}
    else if(ignIdx.has(s)){e.cls='ignore';e.why='전체 근로자에서 무시 처리된 이름';}
    else if(hqSet.has(s)&&a!=='__nothq'){e.cls='hq';e.src='본사 직원명단 자동';}
    else if(!pc&&outIdx.has(normName(e.name))){const o=outIdx.get(normName(e.name));
      // 이번 주 출퇴근 기록이 실제로 있으면 숨기지 않음 (재입사·캠퍼스 이동·휴직 복귀 가능성)
      if(e.active){e.cls='unsorted';e.why=`급여대장상 ${o.why} (${o.campus} ${o.name})인데 이번 주 출퇴근 기록이 있음 — 재입사·이동·복귀면 연결, 아니면 "점검 대상 아님"`;}
      else{e.cls='out';e.why=`${o.why} · ${o.campus} ${o.name}`;}}
    else{e.cls='unsorted';e.why='인원 마스터에 연결된 이름 없음';}
  });
  // 3) 캠퍼스로 분류된 CAPS 항목 ↔ 급여대장 인원 연결
  const byPerson=new Map();
  entries.filter(e=>e.cls==='campus').forEach(e=>{
    const c=(linkIdx.get(strictKey(e.name))||[]).find(x=>groupKey(x.campus)===e.group&&!byPerson.has(x.p));
    if(c){e.person=c.p;e.pcampus=c.campus;byPerson.set(c.p,e);}
  });
  R.entries=entries;
  // 4) 급여대장(마스터) 인원 상태
  Object.entries(PERSONS).forEach(([c,l])=>{if(c==='미분류')return;l.forEach(p=>{
    if(p.ignored)return;
    const h=parseYMD(p.hireDate),lv=parseYMD(p.leaveDate),pos=p.posOverride||'';
    if(lv&&lv<WEEK.start){R.resigned++;return;}
    const row={campus:c,group:groupKey(c),p,pay:p.payName||'',att:p.attendName||'',pos,h,lv};
    if(SKIP_POSITIONS.includes(pos))row.excl='제외 직책 ('+pos+')';
    else if(isSafety(pos))row.excl='안전선생님 (별도 관리)';
    else if(p.isLeave)row.excl='휴직';
    else if(p.isArCenter)row.excl='AR센터';
    else if(h&&h>WEEK.end)row.excl='입사 예정 ('+h+')';
    const e=byPerson.get(p);
    row.entry=e||null;
    row.st=e?'ok':(!p.attendName?'noname':'nocaps');
    if(row.st==='nocaps'){const other=entries.find(x=>strictKey(x.name)===strictKey(p.attendName));row.why=other?`CAPS 이름 "${other.name}"이 ${other.cls==='hq'?'본사':other.cls==='ignore'?'점검 제외':other.cls==='unsorted'?'미분류':other.campus}로 분류됨`:'연결된 CAPS 이름이 이번 주 파일에 없음';}
    R.pay.push(row);
  });});
  R.pay.sort((a,b)=>a.campus.localeCompare(b.campus,'ko')||a.pay.localeCompare(b.pay,'ko'));
  // 처리 필요 = 미분류(이번 주 기록 있음) + 캠퍼스 CAPS 미연결(기록 있음) + 급여대장 이름 미연결
  const unsortedA=entries.filter(e=>e.cls==='unsorted'&&e.active).length;
  const capsOnlyA=entries.filter(e=>e.cls==='campus'&&!e.person&&e.active).length;
  const noname=R.pay.filter(r=>!r.excl&&r.st==='noname').length;
  R.todo=R.hasCaps?unsortedA+capsOnlyA+noname:noname;
  R.cnt={unsortedA,capsOnlyA,noname,nocaps:R.pay.filter(r=>!r.excl&&r.st==='nocaps').length};
  R.sig=sigOf(R);
  if(!R.hasCaps)return R;
  if(!full){ // 화면 갱신 때는 마지막 분석 결과를 그대로 보여줌
    if(ANA&&ANA.week===WEEK.key){Object.assign(R,{soe:ANA.soe,check:ANA.check,auto:ANA.auto,excl:ANA.excl,warn:ANA.warn,analyzed:true,stale:ANA.sig!==R.sig,anaAt:ANA.at});}
    return R;
  }
  R.analyzed=true;R.anaAt=new Date();
  // 5) 누락 판정
  const loaded=new Set(CAPS.files.flatMap(f=>f.months));
  WEEK.months.filter(m=>!loaded.has(m)).forEach(m=>R.warn.push(`${+m.slice(5)}월 CAPS 파일이 없어 ${+m.slice(5)}월 날짜는 판정하지 않았습니다.`));
  if(R.todo)R.warn.push(`인원 분류에서 처리 안 된 ${R.todo}명은 판정에서 빠졌습니다.`);
  const pa=CONFIG.payrollAt?Math.floor((Date.now()-new Date(CONFIG.payrollAt))/864e5):null;
  if(pa===null)R.warn.push('급여대장을 반영한 기록이 없습니다. 주간 파일 업로드에서 급여대장을 올려 주세요.');
  else if(pa>35)R.warn.push(`급여대장 마지막 반영이 ${pa}일 전입니다. 이번 달 급여대장을 반영하세요.`);
  const lvIdx=new Map();
  LEAVES.forEach(l=>{const k=normName(l.name)+'|'+l.date;if(!lvIdx.has(k))lvIdx.set(k,[]);lvIdx.get(k).push(l);});
  const minMin=Math.round((CONFIG.minHours||8)*60);
  R.pay.forEach(row=>{
    const base={campus:row.campus,group:row.group,name:row.att||row.pay,payName:row.pay,position:row.pos};
    if(row.excl){R.excl.push({...base,date:'',why:row.excl});return;}
    if(row.st==='noname')return;
    const nw=(NONWORK[row.campus]||{})[row.att]||[];
    WEEK.dates.forEach(date=>{
      if(!loaded.has(date.slice(0,7))||isHoliday(date))return;
      const b={...base,date};
      if(row.h&&date<row.h){R.excl.push({...b,why:'입사 전'});return;}
      if(row.lv&&date>row.lv){R.excl.push({...b,why:'퇴사 후'});return;}
      if(nw.includes(dowOf(date))){R.excl.push({...b,why:'비근무요일'});return;}
      const r=row.entry?row.entry.rec[date]:null,ci=r?r[0]:'',co=r?r[1]:'';
      const lv=[...new Set([row.pay,row.att].filter(Boolean).map(n=>normName(n)+'|'+date))].flatMap(k=>lvIdx.get(k)||[])
        .filter(l=>!l.campus||!normCampus(l.campus)||groupKey(normCampus(l.campus))===row.group).map(l=>l.type||'연차');
      if(ci&&co){const a=parseTime(ci),bb=parseTime(co);if(a!=null&&bb!=null&&bb-a>=0&&bb-a<minMin)R.check.push({...b,ci,co,hours:((bb-a)/60).toFixed(1),leave:lv.join(', ')});return;}
      const kind=!row.entry?'absent_all':ci?'ci_only':co?'co_only':'none';
      if(lv.length&&lv.every(t=>!/반차|반반차|half|quarter/i.test(t))){R.auto.push({...b,kind,leave:lv.join(', ')});return;}
      R.soe.push({...b,kind,ci,co,hint:lv.length?`연차 기록: ${lv.join(', ')}`:''});
    });
  });
  return R;
}

// 분석 이후 분류·파일·기준이 바뀌었는지 판단용
function sigOf(R){
  let s=[CONFIG.minHours,(CONFIG.holidays||[]).join(),JSON.stringify(NONWORK),LEAVES.length,CAPS.files.map(f=>f.name+f.persons.length).join()].join('|');
  R.pay.forEach(r=>{s+='|'+r.campus+r.pay+r.st+(r.excl||'')+r.att+(r.h||'')+(r.lv||'');});
  R.entries.forEach(e=>{s+='|'+e.key+e.cls+(e.campus||'');});
  let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h;
}
window.runAnalysis=async function(){

  RTAB='soe';switchTab('result');
};

}

// ── CAPS 파일 읽기 ──
function detectMonth(fn){
  let m=fn.match(/(20\d{2})[-._ ]?(\d{1,2})월/);if(m)return `${m[1]}-${pad2(+m[2])}`;
  m=fn.match(/(20\d{2})[-._]?(0[1-9]|1[0-2])(?!\d)/);if(m)return `${m[1]}-${m[2]}`;
  m=fn.match(/(?:^|[^\d])(\d{1,2})월/);if(m){const hit=WEEK.months.find(x=>+x.slice(5)===+m[1]);if(hit)return hit;}
  return null;
}
function chooseMonth(fn){
  return new Promise(res=>{
    window._pickMonth=v=>{closeModal();res(v);};
    showModal(`<div class="ct">📅 몇 월 파일인가요?</div><p class="hint" style="margin-bottom:12px">${esc(fn)} — 파일 이름에서 월을 찾지 못했습니다.</p><div class="row">${WEEK.months.map(m=>`<button class="btn bp" onclick="_pickMonth('${m}')">${+m.slice(5)}월</button>`).join('')}<button class="btn bg" onclick="_pickMonth(null)">취소</button></div>`);
  });
}
function parseCaps(rows,month){
  let hi=-1;
  for(let i=0;i<Math.min(12,rows.length);i++){if(rows[i].some(c=>['이름','성명'].includes(String(c??'').trim()))){hi=i;break;}}
  if(hi<0)return {error:'"이름" 또는 "성명" 열을 찾지 못했습니다'};
  const hdr=rows[hi].map(c=>String(c??'').trim());
  const nameI=hdr.findIndex(h=>h==='이름'||h==='성명');
  const empI=hdr.findIndex(h=>['사원번호','사번','사원코드','번호','ID','id'].includes(h));
  const divI=hdr.findIndex(h=>h==='구분'||h==='출퇴근구분');
  const yr=+WEEK.start.slice(0,4);const cols=[];let needMonth=false;
  hdr.forEach((h,i)=>{
    if(i===nameI||i===empI||i===divI||!h)return;let m;
    if((m=h.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/)))cols.push({i,date:`${m[1]}-${pad2(+m[2])}-${pad2(+m[3])}`});
    else if((m=h.match(/^(\d{1,2})[\/.\-월]\s*(\d{1,2})/)))cols.push({i,date:`${yr}-${pad2(+m[1])}-${pad2(+m[2])}`});
    else if((m=h.match(/^(\d{1,2})(?:일|\s*\(.\))?$/))&&+m[1]>=1&&+m[1]<=31){cols.push({i,day:+m[1]});needMonth=true;}
  });
  if(!cols.length)return {error:'날짜 열(1~31 또는 날짜)을 찾지 못했습니다'};
  if(needMonth&&!month)return {needMonth:true};
  cols.forEach(c=>{if(c.day)c.date=`${month}-${pad2(c.day)}`;});
  const map=new Map(),outDone=new Set();let cur=null;
  for(let ri=hi+1;ri<rows.length;ri++){
    const r=rows[ri];
    const nm=String(r[nameI]??'').trim().replace(/\s+/g,' ');
    const dv=divI>=0?String(r[divI]??'').trim():'';
    const which=/퇴근/.test(dv)?1:/출근/.test(dv)?0:-1;
    if(nm){const e=empI>=0?String(r[empI]??'').trim():'';const k=nm+'|'+e;cur=map.get(k);if(!cur){cur={n:nm,e,r:{}};map.set(k,cur);}outDone.delete(cur);}
    else if(!cur||which!==1||outDone.has(cur))continue; // 이름 없는 행은 바로 위 사람의 '퇴근' 행만 인정 (빈 유령행 방지)
    cols.forEach(c=>{
      if(!WEEK.dates.includes(c.date))return;
      const v=String(r[c.i]??'').trim();if(!v||v==='0'||v==='-')return;
      const slot=cur.r[c.date]||['',''];
      if(which>=0){if(parseTime(v)!=null)slot[which]=v;}
      else{const ts=v.match(/\+?\d{1,2}:\d{2}/g)||[];if(ts[0])slot[0]=ts[0];if(ts[1])slot[1]=ts[1];}
      if(slot[0]||slot[1])cur.r[c.date]=slot;
    });
    if(which===1)outDone.add(cur);
  }
  const months=[...new Set(cols.map(c=>c.date.slice(0,7)))].filter(m=>WEEK.months.includes(m));
  return {persons:[...map.values()],months};
}
window.onCapsFiles=async function(input){
  const files=[...input.files];input.value='';if(!canEdit())return;
  try{await needXLSX();}catch(e){toast(e.message,1);return;}
  for(const file of files){
    try{
      const wb=XLSX.read(new Uint8Array(await file.arrayBuffer()),{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
      let month=detectMonth(file.name)||(WEEK.months.length===1?WEEK.months[0]:null);
      let res=parseCaps(rows,month);
      if(res.needMonth){month=await chooseMonth(file.name);if(!month)continue;res=parseCaps(rows,month);}
      if(res.error){toast(`${file.name}: ${res.error}`,1);continue;}
      if(!res.months.length){toast(`${file.name}: 이번 주(${fmtMD(WEEK.start)}~) 날짜가 없는 파일입니다`,1);continue;}
      CAPS.files=CAPS.files.filter(f=>!f.months.every(m=>res.months.includes(m)));
      CAPS.files.push({name:file.name,months:res.months,persons:res.persons});
      toast(`${file.name}: ${res.persons.length}명 읽음`);
    }catch(e){toast(`${file.name} 읽기 실패: ${e.message}`,1);}
  }
  refresh();queueSave();
};
window.removeCaps=i=>{if(!confirm('이 파일을 이번 주에서 뺄까요?'))return;CAPS.files.splice(i,1);refresh();queueSave();};

window.connectLeave=async function(){
  const email=$('lv-email').value.trim(),pw=$('lv-pw').value;
  if(!email||!pw){toast('연차시스템 이메일·비밀번호를 입력하세요',1);return;}
  $('lv-status').textContent='연결 중…';
  try{
    await needSB();
    const sb=window.supabase.createClient(LV_URL,LV_KEY,{auth:{persistSession:false}});
    const{error:ae}=await sb.auth.signInWithPassword({email,password:pw});
    if(ae)throw new Error('로그인 실패: '+ae.message);
    const{data,error}=await sb.from('leave_requests').select('leave_date,leave_type,status,profiles!leave_requests_user_id_fkey(name),campuses!leave_requests_campus_id_fkey(name)').eq('status','approved').gte('leave_date',WEEK.start).lte('leave_date',WEEK.end).limit(5000);
    if(error)throw new Error(error.message);
    await sb.auth.signOut();
    LEAVES=LEAVES.filter(l=>l.src!=='system');
    (data||[]).forEach(r=>LEAVES.push({name:r.profiles?.name||'',campus:r.campuses?.name||'',date:r.leave_date,type:r.leave_type||'',src:'system'}));
    toast(`연차시스템 ${(data||[]).length}건 가져옴`);refresh();queueSave();

function parseLeaveRows(rows,sheet){
  let hi=-1;
  for(let i=0;i<Math.min(10,rows.length);i++){const c=rows[i].map(x=>String(x||'').trim());if(c.some(x=>/^(이름|성명|name)$/i.test(x))&&c.some(x=>/(날짜|일자|date|시작)/i.test(x))){hi=i;break;}}
  if(hi<0)return 0;
  const h=rows[hi].map(x=>String(x||'').trim());const f=re=>h.findIndex(x=>re.test(x));
  const nI=f(/^(이름|성명|name)$/i),cI=f(/(캠퍼스|campus|소속)/i),dI=f(/^(날짜|일자|date|사용일|휴가일)$/i),sI=f(/(시작|start)/i),eI=f(/(종료|end)/i),tI=f(/(종류|type|구분)/i),stI=f(/(상태|status)/i);
  let n=0;
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i];const name=String(r[nI]||'').trim();if(!name)continue;
    if(stI>=0){const s=String(r[stI]||'').trim();if(s&&!/승인|approved|완료/i.test(s))continue;}
    const campus=cI>=0?String(r[cI]||'').trim():(normCampus(sheet)?sheet:'');
    const type=tI>=0?String(r[tI]||'').trim()||'연차':'연차';
    let dates=[];
    if(dI>=0){const d=parseYMD(r[dI]);if(d)dates=[d];}
    else if(sI>=0){const s=parseYMD(r[sI]),e=eI>=0?(parseYMD(r[eI])||s):s;if(s){let c=s,g=0;while(c<=e&&g++<62){dates.push(c);const [y,m,d]=c.split('-').map(Number);c=ymd(new Date(y,m-1,d+1));}}}
    dates.filter(d=>d>=WEEK.start&&d<=WEEK.end).forEach(d=>{LEAVES.push({name,campus,date:d,type,src:'file'});n++;});
  }
  return n;
}

const PAY_SKIP_SHEETS=['지급내역','급여지출','참고사항','월별비교','Sheet','비교표'];
const PAY_SKIP_DIVS=new Set(['사업소득','일용직']);
function xlDate(v){if(typeof v==='number'){const d=new Date(Math.round((v-25569)*864e5));return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())}`;}return parseYMD(v)||String(v||'').trim();}
window.onPayrollFile=async function(input){
  const file=input.files[0];input.value='';if(!file||!canEdit())return;
  try{
    await needXLSX();
    const wb=XLSX.read(new Uint8Array(await file.arrayBuffer()),{type:'array'});
    const PAY={};
    wb.SheetNames.forEach(sn=>{
      if(PAY_SKIP_SHEETS.some(x=>sn.includes(x)))return;
      const campus=normCampus(sn);if(!campus)return;
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
      let hdr=-1;for(let i=0;i<Math.min(rows.length,10);i++){if(rows[i].some(c=>String(c).includes('성')&&String(c).includes('명'))){hdr=i;break;}}
      if(hdr<0)return;
      const h=rows[hdr].map(c=>String(c).trim());
      const iN=h.findIndex(x=>x.includes('성')&&x.includes('명')),iP=h.findIndex(x=>x.includes('직급')),iD=h.findIndex(x=>x.includes('구분')),iE=h.findIndex(x=>x.includes('사번')||x.includes('사원')),iH=h.findIndex(x=>x.includes('입사일')),iL=h.findIndex(x=>x.includes('퇴사일'));
      PAY[campus]=PAY[campus]||[];
      for(let i=hdr+2;i<rows.length;i++){
        const r=rows[i];const name=String(r[iN]||'').trim().replace(/\s+/g,' ');
        if(!name||name==='합 계'||name==='소 계')continue;
        const div=iD>=0?String(r[iD]||'').trim():'';if(PAY_SKIP_DIVS.has(div))continue;
        const empId=iE>=0?String(r[iE]||'').trim():'';
        PAY[campus].push({name,position:iP>=0?String(r[iP]||'').trim():'',div,empId,hireDate:iH>=0?xlDate(r[iH]):'',leaveDate:iL>=0?xlDate(r[iL]):'',isLeave:empId.includes('휴직')||div.includes('휴직')});
      }
    });
    const total=Object.values(PAY).reduce((a,l)=>a+l.length,0);
    if(!total){toast('급여대장에서 인원을 읽지 못했습니다 (캠퍼스별 탭·"성명" 열 확인)',1);return;}
    // 비교
    const diff={added:[],changed:[],vanished:[]};
    Object.keys(PAY).forEach(c=>{
      const list=PERSONS[c]||[];
      PAY[c].forEach(p=>{
        const ex=list.find(x=>x.payName===p.name||baseName(x.payName)===baseName(p.name));
        if(!ex){diff.added.push({...p,campus:c});return;}
        const set={},ch=[];
        if(p.hireDate&&ex.hireDate!==p.hireDate){ch.push(`입사일 ${ex.hireDate||'없음'} → ${p.hireDate}`);set.hireDate=p.hireDate;}
        if(p.leaveDate&&ex.leaveDate!==p.leaveDate){ch.push(`퇴사일 ${ex.leaveDate||'없음'} → ${p.leaveDate}`);set.leaveDate=p.leaveDate;}
        if((p.isLeave||/육휴|육아휴직|휴직/.test(p.name))&&!ex.isLeave){ch.push('휴직으로 변경');set.isLeave=true;}
        if(ch.length)diff.changed.push({campus:c,payName:ex.payName,set,ch});
      });
      list.forEach(per=>{if(per.leaveDate||per.isLeave||per.ignored)return;if(!PAY[c].some(p=>p.name===per.payName||baseName(p.name)===baseName(per.payName)))diff.vanished.push({campus:c,payName:per.payName});});
    });
    PAY_PENDING={file:file.name,total,campuses:Object.keys(PAY).length,diff};
    showPayrollPreview();
  }catch(e){toast('급여대장 읽기 실패: '+e.message,1);}
};

// 급여대장 인원(D.pay[pi]) ↔ CAPS 항목(D.entries[ei]) 연결
async function linkPair(pi,ei,silent){
  if(!canEdit())return false;
  const row=D.pay[pi],e=D.entries[ei];if(!row||!e)return false;
  const sk=strictKey(e.name),touched=new Set([row.campus]);
  // 같은 CAPS 이름이 다른 사람(다른 캠퍼스 포함)에 연결돼 있으면 옮김. 퇴사·입사예정 인원은 기록으로 두고 건드리지 않음
  const others=e.dup?[]:Object.entries(PERSONS).flatMap(([c,l])=>l.map(p=>({c,p}))).filter(x=>x.p!==row.p&&!x.p.ignored&&x.p.attendName&&strictKey(x.p.attendName)===sk&&!['퇴사','입사'].some(w=>outOf(x.p).startsWith(w)));
  if(others.length){
    if(!silent&&!confirm(`"${e.name}"은(는) 이미 ${others.map(o=>o.c+' '+o.p.payName).join(', ')}에게 연결돼 있습니다.\n${row.campus} ${row.pay}(으)로 옮길까요?`))return false;
    others.forEach(o=>{o.p.attendName=null;o.p.matchType='none';touched.add(o.c);});
  }
  row.p.attendName=e.name;row.p.matchType='manual';
  let a=false;
  if(e.dup){ASSIGN[e.key]=row.campus;a=true;}
  else if(ASSIGN[e.key]&&ASSIGN[e.key]!==row.campus){delete ASSIGN[e.key];a=true;}
  for(const c of touched)await savePersons(c);
  if(a)await saveAssign();
  if(!silent){toast(`${row.pay} ↔ ${e.name} 연결`);refresh();}
  return true;
}

function exactPairs(){
  const free=D.entries.map((e,i)=>({e,i})).filter(x=>(x.e.cls==='campus'&&!x.e.person)||x.e.cls==='unsorted');
  const out=[];const usedE=new Set();
  D.pay.forEach((r,pi)=>{
    if(r.excl||r.st!=='noname')return;
    const k=normName(r.pay);
    const c=free.filter(x=>normName(x.e.name)===k&&((x.e.cls==='campus'&&x.e.group===r.group)||(x.e.cls==='unsorted'&&(!x.e.dup||ASSIGN[x.e.key]===r.campus)&&(!x.e.guess||groupKey(x.e.guess)===r.group))));
    if(c.length!==1||usedE.has(c[0].i))return;
    const rivals=D.pay.filter(o=>o!==r&&!o.excl&&o.st==='noname'&&normName(o.pay)===k&&(c[0].e.cls==='unsorted'||o.group===r.group));
    if(rivals.length)return;
    usedE.add(c[0].i);out.push({pi,ei:c[0].i});
  });
  return out;
}

// ── 발행 ──
async function ensureToken(c){
  if(TOKENS[c])return TOKENS[c];
  const t=randomToken();const{db,doc,setDoc}=window._fb;
  await setDoc(doc(db,'weekly_tokens',c),{campus:c,token:t,createdAt:new Date().toISOString()});
  await setDoc(doc(db,'weekly_campus',t),{campus:c,createdAt:new Date().toISOString()});
  TOKENS[c]=t;return t;
}
window.publish=async function(){
  if(!canEdit())return;
  if(!D.analyzed){toast('먼저 분석을 실행하세요',1);return;}
  if(D.stale&&!confirm('분석한 뒤에 인원 분류·파일이 바뀌었습니다.\n이전 분석 결과로 발행할까요?\n\n(취소 → "다시 분석" 후 발행하면 최신 결과로 나갑니다)'))return;
  if(!D.soe.length){toast('소명 필요 건이 없습니다',1);return;}
  const by={};D.soe.forEach(r=>{(by[r.campus]=by[r.campus]||[]).push(r);});
  const camps=Object.keys(by);
  if(!confirm(`${D.todo?`⚠ 인원 분류 미처리 ${D.todo}명은 판정에서 빠진 상태입니다.\n\n`:''}${fmtMD(WEEK.start)}~${fmtMD(WEEK.end)} 소명 요청 ${D.soe.length}건을 ${camps.length}개 캠퍼스 링크에 올립니다.\n이미 회신한 건은 그대로 두고, 이번 결과에서 사라진 미회신 건은 지웁니다.`))return;
  const{db,doc,collection,getDocs,query,where,writeBatch,setDoc}=window._fb;
  let created=0,kept=0,removed=0;stamp('발행 중…');
  try{
    // 결과에서 빠진 캠퍼스의 미회신 건도 정리
    const all=new Set([...camps,...Object.keys(TOKENS)]);
    for(const c of all){
      const list=by[c]||[];
      if(!list.length&&!TOKENS[c])continue;
      const token=await ensureToken(c);
      const col=collection(db,'weekly_campus',token,'items');
      const snap=await getDocs(query(col,where('weekKey','==',WEEK.key)));
      const ex=new Map();snap.forEach(d=>ex.set(d.id,d.data()));
      const want=new Set();let batch=writeBatch(db),n=0;
      const flush=async()=>{if(n){await batch.commit();batch=writeBatch(db);n=0;}};
      for(const r of list){
        const id=itemId(WEEK.key,r.date,r.name);want.add(id);
        batch.set(doc(col,id+'__ev'),{type:'evidence',itemId:id,evWeek:WEEK.key,campus:c},{merge:true});n++;
        if(ex.has(id)){kept++;}
        else{batch.set(doc(col,id),{weekKey:WEEK.key,weekStart:WEEK.start,weekEnd:WEEK.end,campus:c,name:r.name,payName:r.payName,position:r.position,date:r.date,dow:DOW[dowOf(r.date)],kind:r.kind,ci:r.ci||'',co:r.co||'',hint:r.hint||'',status:'open',reason:'',memo:'',evidenceCount:0,createdAt:new Date().toISOString(),createdBy:user.email});created++;n++;}
        if(n>=400)await flush();
      }
      for(const [id,x] of ex){if(!want.has(id)&&x.status==='open'){batch.delete(doc(col,id));batch.delete(doc(col,id+'__ev'));removed++;n+=2;if(n>=400)await flush();}}
      await flush();
    }
    const summary={};camps.forEach(c=>{summary[c]={soe:by[c].length};});
    const now=new Date().toISOString();
    await setDoc(doc(db,'weekly_runs',WEEK.key),{weekKey:WEEK.key,start:WEEK.start,end:WEEK.end,campuses:summary,total:D.soe.length,publishedAt:now,publishedBy:user.email,analysis:{soe:D.soe.length,check:D.check.length,auto:D.auto.length,unmatched:D.todo},savedAt:now},{merge:true});
    await loadRuns();
    toast(`발행 완료: 신규 ${created} · 유지 ${kept} · 삭제 ${removed}`);stamp('발행 완료');
    await loadReview();switchTab('review');
  }catch(e){toast('발행 실패: '+e.message,1);stamp('발행 실패');}
};

async function loadReview(){
  const wk=WEEK.key;const{db,collection,getDocs,query,where}=window._fb;
  const out=[];
  try{
    await Promise.all(Object.entries(TOKENS).map(async([c,t])=>{
      const s=await getDocs(query(collection(db,'weekly_campus',t,'items'),where('weekKey','==',wk)));
      s.forEach(d=>{const x=d.data();if(x.type!=='evidence')out.push({id:d.id,token:t,...x});});
    }));
  }catch(e){toast('소명 현황 불러오기 실패: '+e.message,1);}
  if(WEEK.key!==wk)return;
  out.sort((a,b)=>a.campus.localeCompare(b.campus,'ko')||a.name.localeCompare(b.name,'ko')||a.date.localeCompare(b.date));
  ITEMS=out;ITEMS_WEEK=wk;if(D)renderBadges();
  if(TAB==='review'||TAB==='prep')renderTab();
}

  h+=`<div class="split"><div class="sl">${left}</div><div class="sr">${tool}${list.length?`<table><thead><tr><th>캠퍼스</th><th>이름</th><th>날짜</th><th>기록</th><th>사유 · 메모</th><th>증빙</th><th>상태</th><th class="edit">처리</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">해당 없음</div>'}</div></div>`;

async function updateItem(it,patch){const{db,doc,updateDoc}=window._fb;await updateDoc(doc(db,'weekly_campus',it.token,'items',it.id),patch);Object.assign(it,patch);}
async function approve(it,ask=true){
  if(!it.reason){toast('사유가 없습니다. ✏️로 사유를 먼저 넣으세요',1);return false;}
  const ev=it.evidenceCount||(it.evidence||[]).length;
  if(ask&&PHOTO_REASONS.has(it.reason)&&!ev&&!confirm('증빙 사진이 없는 건입니다. 그래도 승인할까요?'))return false;
  let repeat=false;
  if(ask&&it.reason==='비근무요일')repeat=confirm(`${it.name} ${it.dow}요일을 매주 비근무요일로 등록할까요?\n(다음 주부터 이 요일 빈칸은 자동 제외)`);
  try{
    await updateItem(it,{status:'approved',reviewedAt:new Date().toISOString(),reviewedBy:user.email,reviewNote:'',nonworkRepeat:repeat});
    if(repeat){const dw=dowOf(it.date);NONWORK[it.campus]=NONWORK[it.campus]||{};const a=NONWORK[it.campus][it.name]||[];if(!a.includes(dw))a.push(dw);NONWORK[it.campus][it.name]=a.sort();await saveNonworkCampus(it.campus);refresh();}
    return true;
  }catch(e){toast('처리 실패: '+e.message,1);return false;}
}
async function reject(it){
  const note=prompt('반려 사유 (원장님 화면에 표시됩니다)',it.reviewNote||'');if(note===null)return false;
  try{await updateItem(it,{status:'rejected',reviewedAt:new Date().toISOString(),reviewedBy:user.email,reviewNote:note});return true;}
  catch(e){toast('처리 실패: '+e.message,1);return false;}
}

window.copyMail=function(c){
  const list=ITEMS.filter(i=>i.campus===c&&(i.status==='open'||i.status==='rejected'));
  const by={};list.forEach(i=>{(by[i.name]=by[i.name]||[]).push(`${fmtMD(i.date)} ${KIND[i.kind]}${i.status==='rejected'?' [반려: '+(i.reviewNote||'')+']':''}`);});
  const body=`[주간 근태 소명 요청] ${c} · ${fmtMD(WEEK.start)} ~ ${fmtMD(WEEK.end)}

원장님, 안녕하세요. 인사팀입니다.
아래 ${list.length}건은 CAPS 출근 또는 퇴근 기록이 없어 확인이 필요합니다.
아래 링크에서 건별로 사유를 선택하고 증빙을 첨부해 주세요.
 - 근무했는데 CAPS를 찍지 않은 경우: 출근·퇴근 모습이 보이는 CCTV 사진
 - 연차·반차·외근인 경우: 기안서(신청서) 사진

▶ 소명 입력: ${linkFor(c)}

${Object.entries(by).map(([n,d])=>`• ${n}: ${d.join(', ')}`).join('\n')}

※ 회신 기한: 이번 주 목요일
※ 본사 승인까지 끝나야 종결됩니다.
인사팀 드림`;
  navigator.clipboard.writeText(body).then(()=>toast('메일 본문 복사됨'));
};

// ═════════════════════════════════════════════
// 💾 주차 기록
// ═════════════════════════════════════════════
async function loadRuns(){try{const{db,collection,getDocs}=window._fb;const s=await getDocs(collection(db,'weekly_runs'));RUNS=[];s.forEach(d=>RUNS.push(d.data()));RUNS.sort((a,b)=>b.weekKey.localeCompare(a.weekKey));}catch(e){}}
function renderHistory(){
  if(!RUNS.length){$('p-history').innerHTML='<div class="card empty"><div class="i">💾</div><b>기록이 없습니다</b><p class="hint">파일을 올리고 분석하면 그 주차가 기록됩니다.</p></div>';return;}
  $('p-history').innerHTML=`<div class="box b-info">CAPS·연차 파일은 올리는 순간, 분석 요약은 분석할 때 자동 저장되고, 소명 회신·사진·승인 기록은 계속 남습니다. 주차를 누르면 그 주로 이동합니다. 사진이 저장 용량(무료 1GB)을 차지하므로 검토가 끝난 주차는 <b>🧹 사진 정리</b>로 승인 건의 사진만 지울 수 있습니다.</div>
  <div class="tw"><table><thead><tr><th>주차</th><th>소명 필요</th><th>짧은 근무</th><th>분류 미처리</th><th>발행</th><th>최근 저장</th><th></th></tr></thead><tbody>${RUNS.map(r=>{const a=r.analysis||{};return `<tr style="${r.weekKey===WEEK.key?'background:var(--pri-lt)':''}"><td class="mono"><b>${fmtMD(r.start)} ~ ${fmtMD(r.end)}</b></td><td>${a.soe??'-'}</td><td>${a.check??'-'}</td><td>${a.unmatched?`<span class="chip c-red">${a.unmatched}</span>`:'0'}</td><td>${r.publishedAt?`<span class="chip c-grn">${r.total}건 · ${r.publishedAt.slice(5,10)}</span>`:'<span class="chip c-gry">미발행</span>'}</td><td class="mono">${(r.savedAt||r.publishedAt||'').slice(0,16).replace('T',' ')}</td><td style="white-space:nowrap"><button class="btn bg sm" onclick="setWeek('${r.start}').then(()=>switchTab('prep'))">📂 열기</button> ${r.publishedAt?`<button class="btn bg sm" onclick="setWeek('${r.start}').then(()=>switchTab('review'))">📨 검토</button> <button class="btn bg sm edit" onclick="cleanupEv('${r.weekKey}')">🧹 사진 정리</button>`:''}</td></tr>`;}).join('')}</tbody></table></div>`;
}
window.cleanupEv=async function(wk){
  if(!confirm(`${fmtMD(wk)} 주차의 "승인" 건 사진을 모두 지웁니다. 사유·메모·승인 기록은 남습니다. 되돌릴 수 없습니다.`))return;
  const{db,doc,collection,getDocs,query,where,writeBatch}=window._fb;let n=0;
  try{
    for(const t of Object.values(TOKENS)){
      const col=collection(db,'weekly_campus',t,'items');
      const s=await getDocs(query(col,where('weekKey','==',wk),where('status','==','approved')));
      let b=writeBatch(db),c=0;
      for(const d of s.docs){const x=d.data();if(!(x.evidenceCount>0)&&!(x.evidence||[]).length)continue;b.set(doc(col,d.id+'__ev'),{images:[],clearedAt:new Date().toISOString()},{merge:true});b.update(doc(col,d.id),{evidenceCount:0,evidence:[],evidenceCleared:true});delete EVCACHE[d.id];n++;c+=2;if(c>=400){await b.commit();b=writeBatch(db);c=0;}}
      if(c)await b.commit();
    }
    toast(`사진 정리 ${n}건`);if(wk===WEEK.key)loadReview();
  }catch(e){toast('정리 실패: '+e.message,1);}
};

// ═════════════════════════════════════════════
// ⚙️ 설정
// ═════════════════════════════════════════════
async function loadConfig(){try{const{db,doc,getDoc}=window._fb;const s=await getDoc(doc(db,'weekly_config','main'));if(s.exists())CONFIG={minHours:8,holidays:[],...s.data()};}catch(e){}}
async function loadNonwork(){try{const{db,collection,getDocs}=window._fb;const s=await getDocs(collection(db,'weekly_nonwork'));NONWORK={};s.forEach(d=>{NONWORK[d.id]=d.data().map||{};});}catch(e){}}
async function saveNonworkCampus(c){const{db,doc,setDoc}=window._fb;await setDoc(doc(db,'weekly_nonwork',c),{campus:c,map:NONWORK[c]||{},updatedAt:new Date().toISOString()});}
async function loadTokens(){try{const{db,collection,getDocs}=window._fb;const s=await getDocs(collection(db,'weekly_tokens'));TOKENS={};s.forEach(d=>{TOKENS[d.id]=d.data().token;});}catch(e){}}
let NWC='';
function renderSettings(){
  const camps=sortCampuses(Object.keys(PERSONS).filter(c=>c!=='미분류'));
  if(!camps.includes(NWC))NWC=camps[0]||'';
  const linkCamps=sortCampuses([...new Set([...camps,...Object.keys(TOKENS)])]);
  $('p-settings').innerHTML=`<div class="grid2">
    <div class="card" style="margin:0"><div class="ct">⏱ 짧은 근무 기준</div><p class="hint" style="margin-bottom:8px">출근~퇴근 체류시간이 이 시간 미만이면 "짧은 근무"로 표시 (정규 9시간, 1시간 여유).</p>
      <div class="row"><input type="number" id="cfg-mh" min="1" max="12" step="0.5" value="${CONFIG.minHours}" style="width:80px"> 시간 미만 <button class="btn bp sm edit" onclick="saveConfig()">저장</button></div>
      <div class="ct" style="margin-top:16px">📅 추가 공휴일·휴원일 <span class="sub">한 줄에 하나, YYYY-MM-DD</span></div>
      <textarea id="cfg-hol" placeholder="2026-12-31">${esc((CONFIG.holidays||[]).join('\n'))}</textarea><div style="margin-top:8px"><button class="btn bp sm edit" onclick="saveConfig()">저장</button></div></div>
    <div class="card" style="margin:0"><div class="ct">🔗 원장 소명 페이지 링크 <span class="sub">캠퍼스마다 고정 1개 · 새면 재발급</span></div>
      <div class="tw" style="max-height:330px"><table><tbody>${linkCamps.map(c=>`<tr><td><b>${esc(c)}</b></td><td>${TOKENS[c]?'<span class="chip c-grn">발급됨</span>':'<span class="hint">발행 시 자동 생성</span>'}</td><td style="white-space:nowrap;text-align:right">${TOKENS[c]?`<button class="btn bg sm" onclick="copyLink('${esc(c)}')">📋 복사</button> `:''}<button class="btn bg sm edit" onclick="issueToken('${esc(c)}')">${TOKENS[c]?'재발급':'발급'}</button></td></tr>`).join('')}</tbody></table></div></div>
  </div>
  <div class="card" style="margin-top:14px"><div class="ct">📆 비근무요일 <span class="sub">단시간 근로자 등 — 지정한 요일 빈칸은 소명 대상에서 빠짐. 소명 검토에서 "비근무요일" 승인 시 매주 반복으로 자동 등록</span></div>
    <div class="row" style="margin-bottom:10px"><select onchange="NWC=this.value;renderSettings()">${camps.map(c=>`<option ${c===NWC?'selected':''}>${esc(c)}</option>`).join('')}</select><span class="sp"></span><button class="btn bp sm edit" onclick="saveNonwork()">💾 ${esc(NWC)} 저장</button></div>
    <div class="tw" style="max-height:460px"><table><thead><tr><th>CAPS 이름</th><th>급여대장 이름</th><th>직책</th><th>비근무요일</th></tr></thead><tbody>${(PERSONS[NWC]||[]).filter(p=>p.attendName&&!p.ignored).map(p=>{const a=(NONWORK[NWC]||{})[p.attendName]||[];return `<tr><td><b>${esc(p.attendName)}</b></td><td>${esc(p.payName||'')}</td><td>${esc(p.posOverride||'')}</td><td><span class="dows">${[1,2,3,4,5].map(d=>`<label class="${a.includes(d)?'on':''}"><input type="checkbox" ${a.includes(d)?'checked':''} onchange="toggleNW(${JSON.stringify(p.attendName).replace(/"/g,'&quot;')},${d},this.checked)">${DOW[d]}</label>`).join('')}</span></td></tr>`;}).join('')||'<tr><td colspan="4" class="hint">CAPS 이름이 연결된 인원이 없습니다</td></tr>'}</tbody></table></div></div>`;
}
window.toggleNW=function(name,d,on){NONWORK[NWC]=NONWORK[NWC]||{};let a=NONWORK[NWC][name]||[];a=on?[...new Set([...a,d])].sort():a.filter(x=>x!==d);if(a.length)NONWORK[NWC][name]=a;else delete NONWORK[NWC][name];renderSettings();};
window.saveNonwork=async()=>{if(!canEdit())return;try{await saveNonworkCampus(NWC);toast(`${NWC} 비근무요일 저장`);refresh();}catch(e){toast('저장 실패: '+e.message,1);}};
window.saveConfig=async function(){
  if(!canEdit())return;
  CONFIG={...CONFIG,minHours:parseFloat($('cfg-mh').value)||8,holidays:$('cfg-hol').value.split(/\n/).map(parseYMD).filter(Boolean),updatedAt:new Date().toISOString(),updatedBy:user.email};
  try{const{db,doc,setDoc}=window._fb;await setDoc(doc(db,'weekly_config','main'),CONFIG);toast('기준 저장됨');renderSettings();refresh();}catch(e){toast('저장 실패: '+e.message,1);}
};
window.issueToken=async function(c){
  if(!canEdit())return;
  if(TOKENS[c]&&!confirm(`${c} 링크를 재발급합니다. 이전 링크는 즉시 쓸 수 없고, 이전 링크의 소명 내역은 새 링크에서 보이지 않습니다. 계속할까요?`))return;
  try{const{db,doc,deleteDoc}=window._fb;const old=TOKENS[c];delete TOKENS[c];await ensureToken(c);if(old){try{await deleteDoc(doc(db,'weekly_campus',old));}catch(e){}}renderSettings();toast(`${c} 링크 발급됨`);}
  catch(e){toast('발급 실패: '+e.message,1);}
};
</script>
