<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>주간 근태 소명</title>
<link rel="icon" type="image/png" href="Poly_Emblem_Blue_B.png">
<script type="module">
  import{initializeApp}from'https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js';
  import{getFirestore,doc,getDoc,updateDoc,collection,getDocs,query,where}from'https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js';
  const CFG={apiKey:"AIzaSyC78vct5-b9wWwcOkEFVfhELytOky6jlqI",authDomain:"polyesc-attendance.firebaseapp.com",projectId:"polyesc-attendance",storageBucket:"polyesc-attendance.firebasestorage.app",messagingSenderId:"430669631304",appId:"1:430669631304:web:eb06ac4ba8d1d5108fed7d"};
  const app=initializeApp(CFG);
  const db=getFirestore(app);
  window._fb={db,doc,getDoc,updateDoc,collection,getDocs,query,where};
  window._fbReady=true;
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root{--green:#ffcd4a;--green-dk:#d4a800;--green-lt:#feefc5;--bg:#f4f6f8;--white:#fff;--border:#dde2ea;--border2:#c8d0db;--text:#1e2a3a;--text2:#4a5568;--text3:#8a96a8;--red:#e53e3e;--orange:#dd6b20;--blue:#3182ce;--teal:#0f766e;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
header{background:var(--green);padding:14px 16px;position:sticky;top:0;z-index:20;box-shadow:0 1px 4px rgba(0,0,0,.12)}
header h1{font-size:17px;font-weight:700;color:#2d2200}
header .sub{font-size:12px;color:#5a4a00;margin-top:2px}
.wrap{max-width:760px;margin:0 auto;padding:14px 12px 120px}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.info{background:#f0f7e8;border:1px solid #c6e0a0;border-radius:var(--radius);padding:11px 13px;font-size:13px;color:var(--text2);margin-bottom:12px}
.err{background:#fff0f0;border:1px solid #fecaca;border-radius:var(--radius);padding:11px 13px;font-size:13px;color:var(--red);margin-bottom:12px}
select,input[type=text]{width:100%;background:var(--white);border:1px solid var(--border2);border-radius:8px;color:var(--text);padding:10px 12px;font-size:15px;font-family:inherit;outline:none}
select:focus,input:focus{border-color:var(--green-dk)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:10px 14px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s}
.btn-primary{background:var(--green);color:#2d2200}.btn-primary:active{background:var(--green-dk)}
.btn-ghost{background:var(--white);color:var(--text2);border:1px solid var(--border)}
.btn-sm{padding:7px 10px;font-size:13px}.btn:disabled{opacity:.45}
.person{margin-bottom:14px}
.person-h{display:flex;align-items:center;gap:8px;padding:6px 2px;font-weight:700;font-size:16px}
.person-h .cnt{font-size:12px;color:var(--text3);font-weight:500}
.item{background:var(--white);border:1px solid var(--border);border-left:4px solid var(--red);border-radius:var(--radius);padding:12px;margin-bottom:8px}
.item.replied{border-left-color:var(--blue)}.item.approved{border-left-color:var(--teal);opacity:.75}.item.rejected{border-left-color:var(--orange)}
.item-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.date{font-weight:700;font-size:15px}
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.chip-red{background:#fff0f0;color:var(--red)}.chip-blue{background:#ebf4ff;color:var(--blue)}.chip-teal{background:#e6f7f5;color:var(--teal)}.chip-orange{background:#fff4ed;color:var(--orange)}.chip-gray{background:#f4f6f8;color:var(--text2)}
.hint{font-size:12px;color:var(--text3)}
.rej{font-size:13px;color:var(--orange);background:#fff4ed;border-radius:6px;padding:6px 9px;margin-bottom:8px}
.row{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.thumb{position:relative;width:64px;height:64px}
.thumb img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--border)}
.thumb .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid #fff}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.footer{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);padding:10px 12px;display:flex;gap:8px;align-items:center;z-index:30;box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.footer .prog{flex:1;font-size:13px;color:var(--text2)}
.bar{height:6px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--border);margin-top:4px}
.bar>div{height:100%;background:var(--teal)}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%) translateY(40px);background:#1e2a3a;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;transition:all .3s;z-index:99;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.done-toggle{font-size:13px;color:var(--text2);cursor:pointer;text-decoration:underline;margin:4px 2px 10px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center;padding:10px}
.modal-bg.show{display:flex}.modal-bg img{max-width:100%;max-height:90vh;border-radius:8px}
</style>
</head>
<body>
<header>
  <h1 id="h-title">주간 근태 소명</h1>
  <div class="sub" id="h-sub">불러오는 중…</div>
</header>
<div class="wrap">
  <div id="msg"></div>
  <div class="card" id="week-card" style="display:none">
    <label class="hint">점검 주차</label>
    <select id="week-sel" onchange="renderList()"></select>
  </div>
  <div class="info" id="guide" style="display:none">
    CAPS 출퇴근 기록이 없거나 한쪽만 있는 날입니다. 건마다 <b>사유를 선택</b>하고 저장해 주세요.
    지류 연차신청서·근무 확인 자료(사진)가 있으면 첨부하면 검토가 빨라집니다 (건당 2장).
    본사 승인까지 끝나야 종결됩니다. 반려된 건은 사유를 고쳐 다시 저장하세요.
  </div>
  <div id="list"></div>
</div>
<div class="footer" id="footer" style="display:none">
  <div class="prog"><span id="prog-text"></span><div class="bar"><div id="prog-bar" style="width:0"></div></div></div>
  <button class="btn btn-primary" onclick="saveAll()">💾 모두 저장</button>
</div>
<div class="modal-bg" id="modal" onclick="this.classList.remove('show')"><img id="modal-img" src=""></div>
<div class="toast" id="toast"></div>

<script>
const REASONS=['지류 연차 (연차신청서)','반차·반반차','CAPS 미체크 (근무함)','외근·출장','교육·행사','비근무요일','병가·공가','기타'];
const KIND_LABEL={none:'기록 없음',ci_only:'퇴근 누락',co_only:'출근 누락',absent_all:'CAPS에 이름 없음'};
const STATUS_LABEL={open:'미회신',replied:'회신 완료 · 본사 검토 중',approved:'승인 (종결)',rejected:'반려 · 다시 회신 필요'};
const DOW_KO=['일','월','화','수','목','금','토'];
const MAX_IMG=2, MAX_EV_BYTES=600*1024, RECENT_WEEKS=8;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
let TOKEN='',CAMPUS='',ITEMS=[],showDone=false;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}
function fmtMD(s){const [y,m,d]=s.split('-').map(Number);return `${m}/${d}(${DOW_KO[new Date(y,m-1,d).getDay()]})`;}
function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

window.addEventListener('DOMContentLoaded',()=>{
  TOKEN=new URLSearchParams(location.search).get('t')||'';
  let n=0;const w=setInterval(()=>{n++;if(window._fbReady){clearInterval(w);init();}else if(n>60){clearInterval(w);$('msg').innerHTML='<div class="err">연결에 실패했습니다. 새로고침해 주세요.</div>';}},100);
});
async function init(){
  if(!TOKEN){$('msg').innerHTML='<div class="err">잘못된 링크입니다. 인사팀에서 받은 캠퍼스 링크로 접속해 주세요.</div>';$('h-sub').textContent='';return;}
  const{db,doc,getDoc}=window._fb;
  try{
    const s=await getDoc(doc(db,'weekly_campus',TOKEN));
    if(!s.exists()) throw new Error('nf');
    CAMPUS=s.data().campus;
  }catch(e){
    $('msg').innerHTML='<div class="err">링크가 유효하지 않습니다 (재발급되었거나 잘못된 링크). 인사팀에 새 링크를 요청해 주세요.</div>';$('h-sub').textContent='';return;
  }
  $('h-title').textContent=`${CAMPUS} 주간 근태 소명`;
  await loadItems();
}
// 최근 8주 + (그보다 오래됐어도) 미회신·반려 건만 읽음. 사진 문서("__ev")는 weekKey/status가 없어 여기 걸리지 않음 → 누를 때만 내려받음
async function loadItems(){
  const{db,collection,getDocs,query,where}=window._fb;
  const col=collection(db,'weekly_campus',TOKEN,'items');
  const cut=new Date(); cut.setDate(cut.getDate()-7*RECENT_WEEKS);
  const [recent,open]=await Promise.all([
    getDocs(query(col,where('weekKey','>=',ymd(cut)))),
    getDocs(query(col,where('status','in',['open','rejected']))),
  ]);
  const map=new Map();
  [recent,open].forEach(snap=>snap.forEach(d=>{const x=d.data();if(x.type==='evidence'||!x.weekKey) return;map.set(d.id,x);}));
  ITEMS=[...map.entries()].map(([id,x])=>({id,...x,_reason:x.reason||'',_memo:x.memo||'',_ev:[],_evLoaded:!(x.evidenceCount>0),_evTouched:false,_dirty:false}));
  const weeks=[...new Set(ITEMS.map(i=>i.weekKey))].sort().reverse();
  if(!weeks.length){$('h-sub').textContent='소명 요청 없음';$('msg').innerHTML='<div class="info">현재 소명이 필요한 건이 없습니다.</div>';return;}
  const sel=$('week-sel');
  const cur=sel.value;
  sel.innerHTML=weeks.map(w=>{const it=ITEMS.find(i=>i.weekKey===w);const o=ITEMS.filter(i=>i.weekKey===w&&(i.status==='open'||i.status==='rejected')).length;return `<option value="${w}">${fmtMD(it.weekStart||w)} ~ ${fmtMD(it.weekEnd||w)} ${o?`· 미회신 ${o}건`:'· 완료'}</option>`;}).join('');
  const firstOpen=weeks.find(w=>ITEMS.some(i=>i.weekKey===w&&(i.status==='open'||i.status==='rejected')));
  sel.value=(cur&&weeks.includes(cur))?cur:(firstOpen||weeks[0]);
  $('week-card').style.display='block';$('guide').style.display='block';$('footer').style.display='flex';
  renderList();
}
function renderList(){
  const wk=$('week-sel').value;
  const list=ITEMS.filter(i=>i.weekKey===wk);
  const open=list.filter(i=>i.status==='open'||i.status==='rejected').length;
  const done=list.filter(i=>i.status==='approved').length;
  $('h-sub').textContent=`${list.length}건 중 미회신 ${open}건 · 승인 ${done}건`;
  $('prog-text').textContent=`회신 ${list.length-open}/${list.length}건 · 승인 ${done}건`;
  $('prog-bar').style.width=list.length?Math.round((list.length-open)/list.length*100)+'%':'0';
  const byName={};
  list.forEach(i=>{(byName[i.name]=byName[i.name]||[]).push(i);});
  const names=Object.keys(byName).sort((a,b)=>{
    const oa=byName[a].some(i=>i.status!=='approved'),ob=byName[b].some(i=>i.status!=='approved');
    if(oa!==ob) return oa?-1:1; return a.localeCompare(b,'ko');
  });
  let html='';
  names.forEach(n=>{
    const its=byName[n].sort((a,b)=>a.date.localeCompare(b.date));
    const allDone=its.every(i=>i.status==='approved');
    if(allDone&&!showDone) return;
    html+=`<div class="person"><div class="person-h">👤 ${esc(n)} <span class="cnt">${its.length}건</span></div>${its.map(renderItem).join('')}</div>`;
  });
  const hiddenDone=names.filter(n=>byName[n].every(i=>i.status==='approved')).length;
  if(hiddenDone&&!showDone) html+=`<div class="done-toggle" onclick="showDone=true;renderList()">승인 완료된 ${hiddenDone}명 보기</div>`;
  if(showDone&&hiddenDone) html+=`<div class="done-toggle" onclick="showDone=false;renderList()">승인 완료 숨기기</div>`;
  $('list').innerHTML=html||'<div class="info">이 주차는 모두 종결되었습니다.</div>';
}
function evBlock(i,idx,editable){
  if(!i._evLoaded) return `<div class="thumbs"><span class="chip chip-gray">📎 사진 ${i.evidenceCount}장</span><button class="btn btn-ghost btn-sm" onclick="loadEv(${idx})">보기</button></div>`;
  if(!i._ev.length) return '';
  return `<div class="thumbs">${i._ev.map((e,k)=>`<div class="thumb"><img src="${e.data}" onclick="viewImg(${idx},${k})">${editable?`<div class="x" onclick="removeImg(${idx},${k})">×</div>`:''}</div>`).join('')}</div>`;
}
function renderItem(i){
  const idx=ITEMS.indexOf(i);
  const ro=i.status==='approved';
  const chip={open:'chip-red',replied:'chip-blue',approved:'chip-teal',rejected:'chip-orange'}[i.status]||'chip-gray';
  return `<div class="item ${i.status}" id="it-${idx}">
    <div class="item-top"><span class="date">${fmtMD(i.date)}</span><span class="chip chip-red">${KIND_LABEL[i.kind]||i.kind}</span>${i.ci?`<span class="hint">출근 ${esc(i.ci)}</span>`:''}${i.co?`<span class="hint">퇴근 ${esc(i.co)}</span>`:''}<span style="flex:1"></span><span class="chip ${chip}">${STATUS_LABEL[i.status]||i.status}</span></div>
    ${i.hint?`<div class="hint" style="margin-bottom:6px">ℹ️ ${esc(i.hint)}</div>`:''}
    ${i.status==='rejected'&&i.reviewNote?`<div class="rej">↩ 본사 반려: ${esc(i.reviewNote)}</div>`:''}
    ${ro?`<div style="font-size:14px"><b>${esc(i.reason)}</b>${i.memo?` · ${esc(i.memo)}`:''}</div>${evBlock(i,idx,false)}`:
    `<select onchange="setField(${idx},'_reason',this.value)"><option value="">▼ 사유 선택</option>${REASONS.map(r=>`<option ${i._reason===r?'selected':''}>${r}</option>`).join('')}</select>
    <div class="row"><input type="text" placeholder="메모 (예: 9/29 연차신청서 제출, 외근 장소 등)" value="${esc(i._memo)}" oninput="setField(${idx},'_memo',this.value)"></div>
    <div class="row">
      <label class="btn btn-ghost btn-sm filebtn">📷 사진 촬영<input type="file" accept="image/*" capture="environment" onchange="addImages(${idx},this)"></label>
      <label class="btn btn-ghost btn-sm filebtn">🖼 파일 첨부<input type="file" accept="image/*" multiple onchange="addImages(${idx},this)"></label>
      <span style="flex:1"></span>
      <button class="btn btn-primary btn-sm" onclick="saveItem(${idx})">${i._dirty?'💾 저장':'✔ 저장됨'}</button>
    </div>
    ${evBlock(i,idx,true)}`}
  </div>`;
}
window.setField=function(idx,f,v){ITEMS[idx][f]=v;ITEMS[idx]._dirty=true;const b=document.querySelector(`#it-${idx} .btn-primary`);if(b)b.textContent='💾 저장';};
window.viewImg=function(idx,k){const e=ITEMS[idx]._ev[k];if(!e)return;$('modal-img').src=e.data;$('modal').classList.add('show');};
window.removeImg=function(idx,k){ITEMS[idx]._ev.splice(k,1);ITEMS[idx]._dirty=true;ITEMS[idx]._evTouched=true;renderList();};
window.loadEv=async function(idx){
  const it=ITEMS[idx]; if(it._evLoaded) return;
  try{
    const{db,doc,getDoc}=window._fb;
    const s=await getDoc(doc(db,'weekly_campus',TOKEN,'items',it.id+'__ev'));
    it._ev=s.exists()?(s.data().images||[]).slice():[];
  }catch(e){toast('사진 불러오기 실패');return;}
  it._evLoaded=true; renderList();
};
window.addImages=async function(idx,input){
  const files=Array.from(input.files); input.value='';
  const it=ITEMS[idx];
  if(!it._evLoaded) await loadEv(idx);
  for(const f of files){
    if(it._ev.length>=MAX_IMG){toast(`사진은 ${MAX_IMG}장까지 첨부할 수 있습니다`);break;}
    try{const data=await resizeImage(f);it._ev.push({name:f.name,data,addedAt:new Date().toISOString()});}
    catch(e){toast('이미지 처리 실패: '+f.name);}
  }
  it._dirty=true; it._evTouched=true; renderList();
};
// 1024px · 화질 60%부터 줄여 장당 200KB 이내 (연차신청서 글씨가 읽히는 수준)
function resizeImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let w=img.width,h=img.height; const MAX=1024;
      if(w>MAX||h>MAX){const r=Math.min(MAX/w,MAX/h);w=Math.round(w*r);h=Math.round(h*r);}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      let q=0.6,out=c.toDataURL('image/jpeg',q);
      while(out.length>200*1024&&q>0.35){q-=0.1;out=c.toDataURL('image/jpeg',q);}
      res(out);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('load'));};
    img.src=url;
  });
}
async function persist(it){
  const{db,doc,updateDoc}=window._fb;
  if(it._evTouched){
    const size=it._ev.reduce((a,e)=>a+e.data.length,0);
    if(size>MAX_EV_BYTES) throw new Error('첨부 용량이 너무 큽니다. 사진 수를 줄여 주세요');
    try{ await updateDoc(doc(db,'weekly_campus',TOKEN,'items',it.id+'__ev'),{images:it._ev,updatedAt:new Date().toISOString()}); }
    catch(e){ throw new Error('사진 저장 실패 — 인사팀에 이 주차 소명요청을 다시 발행해 달라고 요청해 주세요'); }
  }
  await updateDoc(doc(db,'weekly_campus',TOKEN,'items',it.id),{reason:it._reason,memo:it._memo,evidenceCount:it._evLoaded?it._ev.length:(it.evidenceCount||0),status:'replied',repliedAt:new Date().toISOString(),repliedBy:'campus'});
  it.reason=it._reason;it.memo=it._memo;it.status='replied';it._dirty=false;it._evTouched=false;
  if(it._evLoaded) it.evidenceCount=it._ev.length;
}
window.saveItem=async function(idx){
  const it=ITEMS[idx];
  if(!it._reason){toast('사유를 선택해 주세요');return;}
  try{await persist(it);toast('저장되었습니다');renderList();}
  catch(e){toast(e.message);}
};
window.saveAll=async function(){
  const wk=$('week-sel').value;
  const targets=ITEMS.filter(i=>i.weekKey===wk&&i.status!=='approved'&&i._dirty);
  if(!targets.length){toast('저장할 변경 사항이 없습니다');return;}
  const noReason=targets.filter(i=>!i._reason);
  let ok=0,fail=0;
  for(const it of targets){ if(!it._reason) continue; try{await persist(it);ok++;}catch(e){fail++;} }
  renderList();
  toast(`${ok}건 저장${fail?` · 실패 ${fail}건`:''}${noReason.length?` · 사유 미선택 ${noReason.length}건 제외`:''}`);
};
</script>
</body>
</html>
