<html lang="ko">
<head>

<script type="module">
  import{initializeApp}from'https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js';
  import{getFirestore,doc,getDoc,updateDoc,collection,getDocs,query,where}from'https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js';
  const CFG={apiKey:"AIzaSyC78vct5-b9wWwcOkEFVfhELytOky6jlqI",authDomain:"polyesc-attendance.firebaseapp.com",projectId:"polyesc-attendance",storageBucket:"polyesc-attendance.firebasestorage.app",messagingSenderId:"430669631304",appId:"1:430669631304:web:eb06ac4ba8d1d5108fed7d"};
  const app=initializeApp(CFG);
  const db=getFirestore(app);
  window._fb={db,doc,getDoc,updateDoc,collection,getDocs,query,where};
  window._fbReady=true;
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root{--green:#004ea2;--green-dk:#003a7a;--green-lt:#e8f0fb;--bg:#f4f6f8;--white:#fff;--border:#dde2ea;--border2:#c8d0db;--text:#1e2a3a;--text2:#4a5568;--text3:#8a96a8;--red:#e53e3e;--orange:#dd6b20;--blue:#3182ce;--teal:#0f766e;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
header{background:var(--green);padding:14px 16px;position:sticky;top:0;z-index:20;box-shadow:0 1px 4px rgba(0,0,0,.12)}
header h1{font-size:17px;font-weight:700;color:#fff}
header .sub{font-size:12px;color:rgba(255,255,255,.75);margin-top:2px}
.wrap{max-width:1280px;margin:0 auto;padding:14px 12px 120px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.col{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.colh{padding:12px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.colh b{font-size:16px}.colh .n{font-size:20px;font-weight:700}
.colh.todo{background:#fff0f0;border-bottom:3px solid var(--red);color:var(--red)}
.colh.done{background:#e6f7f5;border-bottom:3px solid var(--teal);color:var(--teal)}
.colb{padding:12px}
.col .empty{padding:30px 10px;text-align:center;color:var(--text3);font-size:14px}
.item.rejected{background:#fff8f1;border:2px solid var(--orange);border-left:6px solid var(--orange)}
.item.open{border-left:6px solid var(--red)}
.rejtag{display:inline-block;background:var(--orange);color:#fff;font-size:12px;font-weight:700;border-radius:4px;padding:2px 8px}
.mini{font-size:14px;margin-top:2px}
.btn-del{background:#fff;color:var(--red);border:1px solid #f5c2c2}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.info{background:#f0f7e8;border:1px solid #c6e0a0;border-radius:var(--radius);padding:11px 13px;font-size:13px;color:var(--text2);margin-bottom:12px}
.err{background:#fff0f0;border:1px solid #fecaca;border-radius:var(--radius);padding:11px 13px;font-size:13px;color:var(--red);margin-bottom:12px}
select,input[type=text]{width:100%;background:var(--white);border:1px solid var(--border2);border-radius:8px;color:var(--text);padding:10px 12px;font-size:15px;font-family:inherit;outline:none}
select:focus,input:focus{border-color:var(--green-dk)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:10px 14px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s}
.btn-primary{background:var(--green);color:#fff}.btn-primary:active{background:var(--green-dk)}
.btn-ghost{background:var(--white);color:var(--text2);border:1px solid var(--border)}
.btn-sm{padding:7px 10px;font-size:13px}.btn:disabled{opacity:.45}
.person{margin-bottom:14px}
.person-h{display:flex;align-items:center;gap:8px;padding:6px 2px;font-weight:700;font-size:16px}
.person-h .cnt{font-size:12px;color:var(--text3);font-weight:500}
.item{background:var(--white);border:1px solid var(--border);border-left:4px solid var(--red);border-radius:var(--radius);padding:12px;margin-bottom:8px}
.item.replied{border-left-color:var(--blue)}.item.approved{border-left-color:var(--teal);opacity:.75}.item.rejected{border-left-color:var(--orange)}
.item-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.date{font-weight:700;font-size:15px}
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.chip-red{background:#fff0f0;color:var(--red)}.chip-blue{background:#ebf4ff;color:var(--blue)}.chip-teal{background:#e6f7f5;color:var(--teal)}.chip-orange{background:#fff4ed;color:var(--orange)}.chip-gray{background:#f4f6f8;color:var(--text2)}
.hint{font-size:12px;color:var(--text3)}
.need{font-size:12px;color:var(--red);margin-top:6px}
.apply{font-size:12px;color:var(--blue);text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;font-family:inherit}
.rej{font-size:13px;color:var(--orange);background:#fff4ed;border-radius:6px;padding:6px 9px;margin-bottom:8px}
.row{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.thumb{position:relative;width:64px;height:64px}
.thumb img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--border)}
.thumb .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid #fff}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.footer{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);padding:10px 12px;display:flex;gap:8px;align-items:center;z-index:30;box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.footer .prog{flex:1;font-size:13px;color:var(--text2)}
.bar{height:6px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--border);margin-top:4px}
.bar>div{height:100%;background:var(--teal)}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%) translateY(40px);background:#1e2a3a;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;transition:all .3s;z-index:99;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.done-toggle{font-size:13px;color:var(--text2);cursor:pointer;text-decoration:underline;margin:4px 2px 10px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center;padding:10px}
.pend-bg{position:fixed;inset:0;background:rgba(15,22,35,.55);z-index:150;display:none;align-items:center;justify-content:center;padding:14px}
.pend-bg.show{display:flex}
.pend{background:#fff;border-radius:12px;max-width:440px;width:100%;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.pend h2{font-size:17px;color:var(--red);margin-bottom:6px}
.pend .wk{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid #f5c2c2;background:#fff5f5;border-radius:8px;margin-top:8px}
.pend .wk b{flex:1;font-size:14px}
#week-sel.has-open{color:var(--red);font-weight:700;border-color:var(--red)}
#week-sel option.open{color:var(--red);font-weight:700}
#week-sel option.done{color:var(--text)}
.modal-bg.show{display:flex}.modal-bg img{max-width:100%;max-height:90vh;border-radius:8px}
</style>
</head>
<body>
<header>
  <h1 id="h-title">주간 근태 소명</h1>
  <div class="sub" id="h-sub">불러오는 중…</div>
</header>
<div class="wrap">
  <div id="msg"></div>
  <div class="card" id="week-card" style="display:none">
    <label class="hint">점검 주차</label>
    <select id="week-sel" onchange="renderList()"></select>
  </div>
  <div class="info" id="guide" style="display:none">
    CAPS 출근 또는 퇴근 기록이 없는 날입니다. 건마다 <b>사유를 선택하고 증빙 사진을 첨부</b>한 뒤 저장해 주세요 (건당 3장까지).<br>
    · 근무했는데 CAPS를 안 찍음 → <b>출근·퇴근 모습이 보이는 CCTV 사진</b><br>
    · 연차·반차·외근·병가 → <b>기안서(신청서) 사진</b><br>
    <b>왼쪽 = 아직 처리할 건</b>(미회신·반려) · <b>오른쪽 = 처리한 건</b>(본사 검토 중·승인). 잘못 회신한 건은 오른쪽에서 <b>수정</b>하거나 <b>회신 지우기</b>를 누르세요.
  </div>
  <div id="list"></div>
</div>
<div class="footer" id="footer" style="display:none">
  <div class="prog"><span id="prog-text"></span><div class="bar"><div id="prog-bar" style="width:0"></div></div></div>
  <button class="btn btn-primary" onclick="saveAll()">💾 모두 저장</button>
</div>
<div class="modal-bg" id="modal" onclick="this.classList.remove('show')"><img id="modal-img" src=""></div>
<div class="pend-bg" id="pend"><div class="pend" id="pend-box"></div></div>
<div class="toast" id="toast"></div>

<script>
// 본사 weekly_attendant.html의 REASONS와 같은 목록이어야 함
const REASONS=['CAPS 미체크 (근무함) — CCTV 사진','연차 (기안서·연차신청서)','반차·반반차 (기안서)','외근·출장 (기안서)','교육·행사','병가·공가 (증빙)','셔틀 탑승','비근무요일','기타 (메모 필수)'];
const PHOTO_REQ=new Set(['CAPS 미체크 (근무함) — CCTV 사진','연차 (기안서·연차신청서)','반차·반반차 (기안서)','외근·출장 (기안서)','병가·공가 (증빙)']);
const KIND_LABEL={none:'기록 없음',ci_only:'퇴근 누락',co_only:'출근 누락',absent_all:'CAPS에 이름 없음',no_caps:'CAPS 미등록',need_id:'CAPS ID 생성 필요',not_deleted:'퇴사자 CAPS 삭제 필요',unknown:'급여대장 내 이름 확인 불가'};
// 인원 단위 확인 요청 (본사 weekly_attendant.html의 PERSON_REASONS와 같은 목록)
const PERSON_REASONS={need_id:['CAPS ID 추가함 (메모에 CAPS 이름)','이번 달 퇴사자','휴직 중','기타 (메모 필수)'],not_deleted:['CAPS에서 삭제함','재직 중 (메모에 설명)','기타 (메모 필수)'],unknown:['퇴사자 — CAPS에서 삭제함','입사 예정자','외부 소속 (우리 회사 아님)','급여대장 이름 다름 (메모에 이름)','기타 (메모 필수)']};
const PERSON_GUIDE={need_id:'급여대장에는 있는데 CAPS에서 이름을 찾을 수 없습니다. CAPS ID를 만들었다면 메모에 CAPS에 등록한 이름을 적어 주세요.',not_deleted:'퇴사한 분인데 CAPS에 이름이 남아 있습니다. CAPS에서 삭제해 주세요.',unknown:'CAPS에 있는 이름인데 급여대장에서 확인되지 않습니다. 누구인지 알려 주세요.'};
const reasonsFor=i=>i.scope==='person'?(PERSON_REASONS[i.kind]||REASONS):REASONS;
const MEMO_REQ=/메모에|기타/;
const STATUS_LABEL={open:'미회신',replied:'회신 완료 · 본사 검토 중',approved:'승인 (종결)',rejected:'반려 · 다시 회신 필요'};
const DOW_KO=['일','월','화','수','목','금','토'];
const MAX_IMG=3, MAX_EV_BYTES=750*1024, RECENT_WEEKS=8;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
let TOKEN='',CAMPUS='',ITEMS=[],showDone=false;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}
function fmtMD(s){const [y,m,d]=s.split('-').map(Number);return `${m}/${d}(${DOW_KO[new Date(y,m-1,d).getDay()]})`;}
function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

window.addEventListener('DOMContentLoaded',()=>{
  TOKEN=new URLSearchParams(location.search).get('t')||'';
  let n=0;const w=setInterval(()=>{n++;if(window._fbReady){clearInterval(w);init();}else if(n>60){clearInterval(w);$('msg').innerHTML='<div class="err">연결에 실패했습니다. 새로고침해 주세요.</div>';}},100);
});
async function init(){
  if(!TOKEN){$('msg').innerHTML='<div class="err">잘못된 링크입니다. 인사팀에서 받은 캠퍼스 링크로 접속해 주세요.</div>';$('h-sub').textContent='';return;}
  const{db,doc,getDoc}=window._fb;
  try{
    const s=await getDoc(doc(db,'weekly_campus',TOKEN));
    if(!s.exists()) throw new Error('nf');
    CAMPUS=s.data().campus;
  }catch(e){
    $('msg').innerHTML='<div class="err">링크가 유효하지 않습니다 (재발급되었거나 잘못된 링크). 인사팀에 새 링크를 요청해 주세요.</div>';$('h-sub').textContent='';return;
  }
  $('h-title').textContent=`${CAMPUS} 주간 근태 소명`;
  await loadItems();
}
// 최근 8주 + (그보다 오래됐어도) 미회신·반려 건만 읽음. 사진 문서("__ev")는 weekKey/status가 없어 여기 걸리지 않음 → 누를 때만 내려받음
async function loadItems(){
  const{db,collection,getDocs,query,where}=window._fb;
  const col=collection(db,'weekly_campus',TOKEN,'items');
  const cut=new Date(); cut.setDate(cut.getDate()-7*RECENT_WEEKS);
  const [recent,open]=await Promise.all([
    getDocs(query(col,where('weekKey','>=',ymd(cut)))),
    getDocs(query(col,where('status','in',['open','rejected']))),
  ]);
  const map=new Map();
  [recent,open].forEach(snap=>snap.forEach(d=>{const x=d.data();if(x.type==='evidence'||!x.weekKey) return;map.set(d.id,x);}));
  ITEMS=[...map.entries()].map(([id,x])=>({id,...x,_reason:x.reason||'',_memo:x.memo||'',_ev:[],_evLoaded:!(x.evidenceCount>0),_evTouched:false,_dirty:false}));
  const weeks=[...new Set(ITEMS.map(i=>i.weekKey))].sort().reverse();
  if(!weeks.length){$('h-sub').textContent='소명 요청 없음';$('msg').innerHTML='<div class="info">현재 소명이 필요한 건이 없습니다.</div>';return;}
  const sel=$('week-sel');
  const cur=sel.value;
  sel.innerHTML=weeks.map(w=>{const it=ITEMS.find(i=>i.weekKey===w);const c=pendOf(w);return `<option value="${w}" class="${c.total?'open':'done'}">${c.total?'🔴 ':'✅ '}${fmtMD(it.weekStart||w)} ~ ${fmtMD(it.weekEnd||w)} ${c.total?'· '+[c.open?`미회신 ${c.open}건`:'',c.rej?`반려 ${c.rej}건`:''].filter(Boolean).join(' · '):'· 완료'}</option>`;}).join('');
  const firstOpen=weeks.find(w=>ITEMS.some(i=>i.weekKey===w&&(i.status==='open'||i.status==='rejected')));
  sel.value=(cur&&weeks.includes(cur))?cur:(firstOpen||weeks[0]);
  $('week-card').style.display='block';$('guide').style.display='block';$('footer').style.display='flex';
  renderList();
  if(!cur)showPending(weeks);   // 페이지를 열 때마다 남은 건 알림
}
function pendOf(w){const l=ITEMS.filter(i=>i.weekKey===w);const open=l.filter(i=>i.status==='open').length,rej=l.filter(i=>i.status==='rejected').length;return {open,rej,total:open+rej};}
function weekLabel(w){const it=ITEMS.find(i=>i.weekKey===w)||{};return `${fmtMD(it.weekStart||w)} ~ ${fmtMD(it.weekEnd||w)}`;}
// 미회신·반려가 남은 주차 알림 팝업
function showPending(weeks){
  const left=weeks.filter(w=>pendOf(w).total);
  if(!left.length)return;
  const sum=left.reduce((a,w)=>a+pendOf(w).total,0);
  $('pend-box').innerHTML=`<h2>⚠️ 처리하지 않은 소명이 ${sum}건 있습니다</h2>
    <div class="hint" style="font-size:13px">아래 주차의 미회신·반려 건을 처리해 주세요. 본사 승인까지 끝나야 종결됩니다.</div>
    ${left.map(w=>{const c=pendOf(w);return `<div class="wk"><b>${weekLabel(w)}</b>${c.open?`<span class="chip chip-red">미회신 ${c.open}</span>`:''}${c.rej?`<span class="chip chip-orange">반려 ${c.rej}</span>`:''}<button class="btn btn-primary btn-sm" onclick="goWeek('${w}')">보기</button></div>`;}).join('')}
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn btn-ghost" onclick="$('pend').classList.remove('show')">닫기</button></div>`;
  $('pend').classList.add('show');
}
window.goWeek=function(w){$('week-sel').value=w;$('pend').classList.remove('show');renderList();window.scrollTo({top:0,behavior:'smooth'});
}
function groupByName(items,renderer){
  const by={};items.forEach(i=>{(by[i.name]=by[i.name]||[]).push(i);});
  return Object.keys(by).sort((a,b)=>a.localeCompare(b,'ko')).map(n=>{const its=by[n].sort((a,b)=>a.date.localeCompare(b.date));
    return `<div class="person"><div class="person-h">👤 ${esc(n)} <span class="cnt">${its.length}건</span></div>${its.map(renderer).join('')}</div>`;}).join('');
}
function renderList(){
  const wk=$('week-sel').value;
  // 저장·지우기 후에도 주차 목록 표시(🔴/✅, 남은 건수)를 최신으로
  [...$('week-sel').options].forEach(o=>{const c=pendOf(o.value);o.className=c.total?'open':'done';o.textContent=`${c.total?'🔴 ':'✅ '}${weekLabel(o.value)} ${c.total?'· '+[c.open?`미회신 ${c.open}건`:'',c.rej?`반려 ${c.rej}건`:''].filter(Boolean).join(' · '):'· 완료'}`;});
  $('week-sel').classList.toggle('has-open',pendOf(wk).total>0);
  const list=ITEMS.filter(i=>i.weekKey===wk);
  const isTodo=i=>i.status==='open'||i.status==='rejected';
  const todo=list.filter(isTodo),done=list.filter(i=>!isTodo(i));
  const nOpen=todo.filter(i=>i.status==='open').length,nRej=todo.filter(i=>i.status==='rejected').length;
  const nRep=done.filter(i=>i.status==='replied').length,nOk=done.filter(i=>i.status==='approved').length;
  $('h-sub').textContent=`${list.length}건 중 처리할 건 ${todo.length}건 (미회신 ${nOpen} · 반려 ${nRej}) · 승인 ${nOk}건`;
  $('prog-text').textContent=`처리 ${done.length}/${list.length}건 · 승인 ${nOk}건`;
  $('prog-bar').style.width=list.length?Math.round(done.length/list.length*100)+'%':'0';
  // 왼쪽: 반려 먼저, 그다음 미회신
  const left=todo.length?(nRej?`<div class="hint" style="color:var(--orange);font-weight:700;margin:0 2px 6px">↩ 반려 — 다시 처리 ${nRej}건</div>${groupByName(todo.filter(i=>i.status==='rejected'),renderItem)}`:'')+(nOpen?`<div class="hint" style="color:var(--red);font-weight:700;margin:${nRej?'14px':'0'} 2px 6px">● 미회신 ${nOpen}건</div>${groupByName(todo.filter(i=>i.status==='open'),renderItem)}`:''):'<div class="empty">✅ 처리할 건이 없습니다</div>';
  const shownDone=done.filter(i=>i.status==='replied'||showDone);
  const right=(shownDone.length?groupByName(shownDone,renderDone):'<div class="empty">아직 처리한 건이 없습니다</div>')
    +(nOk?`<div class="done-toggle" onclick="showDone=!showDone;renderList()">${showDone?'승인 완료 숨기기':`승인 완료 ${nOk}건 보기`}</div>`:'');
  $('list').innerHTML=`<div class="cols">
    <div class="col"><div class="colh todo"><b>📝 처리할 건</b><span class="n">${todo.length}</span><span style="font-size:12px">미회신 ${nOpen} · 반려 ${nRej}</span></div><div class="colb">${left}</div></div>
    <div class="col"><div class="colh done"><b>✅ 처리한 건</b><span class="n">${done.length}</span><span style="font-size:12px">본사 검토 중 ${nRep} · 승인 ${nOk}</span></div><div class="colb">${right}</div></div>
  </div>`;
}
// 오른쪽(처리한 건): 보기 전용 + 수정 / 회신 지우기
function renderDone(i){
  if(i._editing)return renderItem(i);
  const idx=ITEMS.indexOf(i),ok=i.status==='approved';
  return `<div class="item ${i.status}" id="it-${idx}">
    <div class="item-top"><span class="date">${i.scope==='person'?'인원 확인':fmtMD(i.date)}</span><span class="chip chip-red">${KIND_LABEL[i.kind]||i.kind}</span><span style="flex:1"></span><span class="chip ${ok?'chip-teal':'chip-blue'}">${STATUS_LABEL[i.status]||i.status}</span></div>
    <div class="mini"><b>${esc(i.reason)}</b>${i.memo?` · ${esc(i.memo)}`:''}</div>
    ${evBlock(i,idx,false)}
    ${ok?'':`<div class="row"><span style="flex:1"></span><button class="btn btn-ghost btn-sm" onclick="editDone(${idx})">✏️ 수정</button><button class="btn btn-del btn-sm" onclick="clearReply(${idx})">🗑 회신 지우기</button></div>`}
  </div>`;
}
window.editDone=function(idx){const it=ITEMS[idx];it._editing=true;it._reason=it.reason||'';it._memo=it.memo||'';renderList();};
window.cancelEdit=function(idx){const it=ITEMS[idx];it._editing=false;it._dirty=false;it._reason=it.reason||'';it._memo=it.memo||'';if(it._evTouched){it._evLoaded=false;it._ev=[];it._evTouched=false;}renderList();};
// 잘못 넣은 회신 지우기 → 미회신으로 되돌림 (사유·메모·사진 삭제)
window.clearReply=async function(idx){
  const it=ITEMS[idx];
  if(!confirm(`${it.name} ${it.scope==='person'?'(인원 확인)':fmtMD(it.date)} 회신을 지울까요?\n사유·메모·사진이 모두 지워지고 "미회신"으로 돌아갑니다.`))return;
  const{db,doc,updateDoc}=window._fb;
  try{
    if((it.evidenceCount||0)>0||(it._ev||[]).length){await updateDoc(doc(db,'weekly_campus',TOKEN,'items',it.id+'__ev'),{images:[],updatedAt:new Date().toISOString()});}
    await updateDoc(doc(db,'weekly_campus',TOKEN,'items',it.id),{reason:'',memo:'',evidenceCount:0,status:'open',repliedAt:'',repliedBy:'',clearedAt:new Date().toISOString()});
    Object.assign(it,{reason:'',memo:'',evidenceCount:0,status:'open',_reason:'',_memo:'',_ev:[],_evLoaded:true,_evTouched:false,_dirty:false,_editing:false});
    toast('회신을 지웠습니다 — 왼쪽 "처리할 건"으로 옮겨졌습니다');renderList();
  }catch(e){toast('지우기 실패 — 새로고침 후 다시 시도해 주세요');}
};
function evBlock(i,idx,editable){
  if(!i._evLoaded) return `<div class="thumbs"><span class="chip chip-gray">📎 사진 ${i.evidenceCount}장</span><button class="btn btn-ghost btn-sm" onclick="loadEv(${idx})">보기</button></div>`;
  if(!i._ev.length) return '';
  return `<div class="thumbs">${i._ev.map((e,k)=>`<div class="thumb"><img src="${e.data}" onclick="viewImg(${idx},${k})">${editable?`<div class="x" onclick="removeImg(${idx},${k})">×</div>`:''}</div>`).join('')}</div>`;
}
function renderItem(i){
  const idx=ITEMS.indexOf(i);
  const ro=i.status==='approved';
  const chip={open:'chip-red',replied:'chip-blue',approved:'chip-teal',rejected:'chip-orange'}[i.status]||'chip-gray';
  return `<div class="item ${i.status}" id="it-${idx}">
    <div class="item-top"><span class="date">${i.scope==='person'?'인원 확인':fmtMD(i.date)}</span><span class="chip chip-red">${KIND_LABEL[i.kind]||i.kind}</span>${i.ci?`<span class="hint">출근 ${esc(i.ci)}</span>`:''}${i.co?`<span class="hint">퇴근 ${esc(i.co)}</span>`:''}<span style="flex:1"></span><span class="chip ${chip}">${STATUS_LABEL[i.status]||i.status}</span></div>
    ${i.hint?`<div class="hint" style="margin-bottom:6px">ℹ️ ${esc(i.hint)}</div>`:''}
    ${i.status==='rejected'?`<div class="rej"><span class="rejtag">↩ 반려됨 · 다시 처리</span> ${esc(i.reviewNote||'')}</div>`:''}
    ${ro?`<div style="font-size:14px"><b>${esc(i.reason)}</b>${i.memo?` · ${esc(i.memo)}`:''}</div>${evBlock(i,idx,false)}`:
    `<select onchange="setField(${idx},'_reason',this.value)"><option value="">▼ 사유 선택</option>${reasonsFor(i).map(r=>`<option ${i._reason===r?'selected':''}>${r}</option>`).join('')}</select>
    ${i.scope==='person'?`<div class="hint" style="margin-top:6px">ℹ️ ${PERSON_GUIDE[i.kind]||''}</div>`:''}
    ${PHOTO_REQ.has(i._reason)&&!evCount(i)?'<div class="need">📷 이 사유는 증빙 사진이 필요합니다</div>':''}
    <div class="row"><input type="text" placeholder="${i.scope==='person'?'메모 (예: CAPS 이름 Annie Kim으로 추가)':'메모 (예: CCTV 09:02 출근 확인, 10/27 연차 기안 등)'}" value="${esc(i._memo)}" oninput="setField(${idx},'_memo',this.value)"></div>
    ${i._reason&&ITEMS.some(o=>o!==i&&(o.scope||'day')===(i.scope||'day')&&o.weekKey===i.weekKey&&o.name===i.name&&o.status!=='approved'&&!o._reason)?`<div class="row"><button class="apply" onclick="applySame(${idx})">↳ ${esc(i.name)}의 사유 없는 다른 날짜에도 이 사유 적용</button></div>`:''}
    <div class="row">
      <label class="btn btn-ghost btn-sm filebtn">📎 사진·파일 첨부<input type="file" accept="image/*" multiple onchange="addImages(${idx},this)"></label>
      <span style="flex:1"></span>
      ${i._editing?`<button class="btn btn-ghost btn-sm" onclick="cancelEdit(${idx})">취소</button>`:''}<button class="btn btn-primary btn-sm" onclick="saveItem(${idx})">${i._dirty?'💾 저장':'✔ 저장됨'}</button>
    </div>
    ${evBlock(i,idx,true)}`}
  </div>`;
}
window.setField=function(idx,f,v){ITEMS[idx][f]=v;ITEMS[idx]._dirty=true;if(f==='_reason'){renderList();return;}const b=document.querySelector(`#it-${idx} .btn-primary`);if(b)b.textContent='💾 저장';};
function evCount(i){return i._evLoaded?i._ev.length:(i.evidenceCount||0);}
window.applySame=function(idx){const s=ITEMS[idx];let n=0;ITEMS.forEach(o=>{if(o!==s&&(o.scope||'day')===(s.scope||'day')&&o.weekKey===s.weekKey&&o.name===s.name&&o.status!=='approved'&&!o._reason){o._reason=s._reason;if(!o._memo)o._memo=s._memo;o._dirty=true;n++;}});renderList();toast(`${n}건에 적용 — 사진은 건마다 첨부하고 저장해 주세요`);};
function checkReady(it){if(!it._reason)return '사유를 선택해 주세요';if(PHOTO_REQ.has(it._reason)&&!evCount(it))return `${fmtMD(it.date)} 증빙 사진을 첨부해 주세요`;if(MEMO_REQ.test(it._reason)&&!it._memo.trim())return `${it.name}: 메모를 적어 주세요`;return '';}
window.viewImg=function(idx,k){const e=ITEMS[idx]._ev[k];if(!e)return;$('modal-img').src=e.data;$('modal').classList.add('show');};
window.removeImg=function(idx,k){ITEMS[idx]._ev.splice(k,1);ITEMS[idx]._dirty=true;ITEMS[idx]._evTouched=true;renderList();};
window.loadEv=async function(idx){
  const it=ITEMS[idx]; if(it._evLoaded) return;
  try{
    const{db,doc,getDoc}=window._fb;
    const s=await getDoc(doc(db,'weekly_campus',TOKEN,'items',it.id+'__ev'));
    it._ev=s.exists()?(s.data().images||[]).slice():[];
  }catch(e){toast('사진 불러오기 실패');return;}
  it._evLoaded=true; renderList();
};
window.addImages=async function(idx,input){
  const files=Array.from(input.files); input.value='';
  const it=ITEMS[idx];
  if(!it._evLoaded) await loadEv(idx);
  for(const f of files){
    if(it._ev.length>=MAX_IMG){toast(`사진은 ${MAX_IMG}장까지 첨부할 수 있습니다`);break;}
    try{const data=await resizeImage(f);it._ev.push({name:f.name,data,addedAt:new Date().toISOString()});}
    catch(e){toast('이미지 처리 실패: '+f.name);}
  }
  it._dirty=true; it._evTouched=true; renderList();
};
// 1024px · 화질 60%부터 줄여 장당 200KB 이내 (연차신청서 글씨가 읽히는 수준)
function resizeImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let w=img.width,h=img.height; const MAX=1024;
      if(w>MAX||h>MAX){const r=Math.min(MAX/w,MAX/h);w=Math.round(w*r);h=Math.round(h*r);}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      let q=0.6,out=c.toDataURL('image/jpeg',q);
      while(out.length>230*1024&&q>0.35){q-=0.1;out=c.toDataURL('image/jpeg',q);}
      res(out);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('load'));};
    img.src=url;
  });
}
async function persist(it){
  const{db,doc,updateDoc}=window._fb;
  if(it._evTouched){
    const size=it._ev.reduce((a,e)=>a+e.data.length,0);
    if(size>MAX_EV_BYTES) throw new Error('첨부 용량이 너무 큽니다. 사진 수를 줄여 주세요');
    try{ await updateDoc(doc(db,'weekly_campus',TOKEN,'items',it.id+'__ev'),{images:it._ev,updatedAt:new Date().toISOString()}); }
    catch(e){ throw new Error('사진 저장 실패 — 인사팀에 이 주차 소명요청을 다시 발행해 달라고 요청해 주세요'); }
  }
  await updateDoc(doc(db,'weekly_campus',TOKEN,'items',it.id),{reason:it._reason,memo:it._memo,evidenceCount:it._evLoaded?it._ev.length:(it.evidenceCount||0),status:'replied',repliedAt:new Date().toISOString(),repliedBy:'campus'});
  it.reason=it._reason;it.memo=it._memo;it.status='replied';it._dirty=false;it._evTouched=false;it._editing=false;
  if(it._evLoaded) it.evidenceCount=it._ev.length;
}
window.saveItem=async function(idx){
  const it=ITEMS[idx];
  const m=checkReady(it);if(m){toast(m);return;}
  try{await persist(it);toast('저장되었습니다');renderList();}
  catch(e){toast(e.message);}
};
window.saveAll=async function(){
  const wk=$('week-sel').value;
  const targets=ITEMS.filter(i=>i.weekKey===wk&&i.status!=='approved'&&i._dirty);
  if(!targets.length){toast('저장할 변경 사항이 없습니다');return;}
  const notReady=targets.filter(i=>checkReady(i));
  let ok=0,fail=0;
  for(const it of targets){ if(checkReady(it)) continue; try{await persist(it);ok++;}catch(e){fail++;} }
  renderList();
  toast(`${ok}건 저장${fail?` · 실패 ${fail}건`:''}${notReady.length?` · 사유·사진 미완료 ${notReady.length}건 제외`:''}`);
};
</script>
